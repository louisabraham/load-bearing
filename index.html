<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The load-bearing vocabulary of Claude</title>
<!-- The only thing this page fetches that is not the analysis: the site's counter, configured
     once at the root of the domain and loaded from there by every project page, so the key and
     the settings are in one file rather than pasted into each.

     The path is root-relative and stays that way. This page is served from
     louisabraham.github.io/load-bearing/, so it resolves; a fork served from another github.io,
     and a copy opened from a checkout, find nothing at it and report nothing. -->
<script defer src="/assets/js/ph.js"></script>
<style>
  /* RASTERFELD -- the board.
 *
 * One screen, no fold. Every part has its own compartment in a twelve-column field: the
 * corpus, the clustering, the stack, the chosen word, the words themselves. The thousand words
 * scroll inside their own cell instead of pushing the chart off the bottom, and a word is
 * clicked rather than hovered, so it stays chosen and the panel can be read with both hands
 * off the mouse.
 *
 * Bauhaus in two senses: the primaries against black on paper, and geometry doing the work
 * decoration would otherwise do. Light only -- Bauhaus printing was ink on paper and a dark
 * ground would invert the premise -- so `prefers-color-scheme` is deliberately not honoured,
 * and `color-scheme: only light` says so to the browser as well, which would otherwise repaint
 * the board itself on a phone that is in dark mode.
 *
 * Colour carries meaning rather than identity: the accent is reserved for the one cluster that
 * arrives and for the current selection, and the other seven bands are one grey ramp. The
 * accent clears 4.5:1 on the ground, because it sets small text and not only marks.
 */

  :root {
    /* Light only, said to the browser and not only in the note above.

       The board declines to honour `prefers-color-scheme`, which stops the PAGE turning dark
       and does nothing to stop the BROWSER turning it dark on the page's behalf. A phone in
       dark mode, finding no `color-scheme` on a page, repaints one: Firefox for Android does
       it, Chrome for Android does it, and the result is not the board in other colours but the
       board in two colour schemes at once. The prose inverted to white on #121212 while the
       accent, the three primaries and every fill inside the two charts stayed exactly as
       printed -- so the labels over the stack, dark ink at 62% on bands that had not moved,
       came out as grey on grey and could barely be read.

       `only light` and not `light`: `light` says which schemes the page supports, and a
       browser forcing dark overrides it anyway -- measured, it changed 68% of the board's
       pixels either way. `only` is the half that withholds the permission, and with it the
       board renders pixel for pixel as it does on a phone in daylight. */
    color-scheme: only light;
    /* Grotesk for the page, mono for anything that is a measurement. No web fonts: the page is
       one file that reads one file.

       `Inter` is deliberately NOT in this list. A stack is a list of wishes and the browser
       grants the first one it can, which makes any name in it a name you are promising to
       accept in whatever cut the machine happens to hold. On a phone with Inter installed,
       Firefox granted it -- and the cut installed there is a hairline. Every heading and every
       figure came out at one thin stroke whether the CSS asked for 400, 500 or 700, measured
       four times thinner than the same text in Chrome, which reads as grey text on a white
       ground rather than as black. Chrome does not see that font at all, so only one browser
       showed it, and each of Roboto, system-ui and sans-serif goes properly bold on the same
       phone -- they simply sat behind Inter in the queue and never got a turn.

       A face is worth naming here only if every machine that has it has it in the weights the
       board is set in. Inter is not, so it goes; the rest are the platform's own text faces,
       which are. `Roboto` is named ahead of the two UI keywords for the same reason -- it is
       what either can mean on a phone, and Firefox does not implement `ui-sans-serif` at all,
       so left to the keywords the two browsers reach it by different routes. */
    --grotesk: "Helvetica Neue", Helvetica, Roboto, ui-sans-serif, system-ui, Arial, sans-serif;
    /* every named face here is absent from a phone, so both browsers fall to the same
       `monospace` -- which is why the labels were the one thing that already matched */
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --ground: #ffffff;
    --ink: #0d0d0d;
    --muted: #5f5f5f;
    --accent: #de301e;
    --hairline: #0d0d0d;
    --fill: #de301e1f;
    --rule: 2px;
    /* the printed rule the whole board is drawn with */
    --pad: 16px 18px;
  }

  * {
    box-sizing: border-box;
  }

  /* The page sets its own text sizes and the board is measured against them, so no browser may
     inflate them on its behalf. Only the `-webkit-` spelling was here, which Firefox does not
     read: on Firefox for Android, where the opt-out is spelled unprefixed (and `-moz-` on the
     older builds), the labels and the words in the column came back scaled up, wrapped lines
     the board had budgeted one line for and pushed the measurements out of their cells. All
     three spellings, so every phone leaves the text at the size it is written at. */
  html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 17px/1.5 var(--grotesk);
    -webkit-font-smoothing: antialiased;
  }

  svg {
    display: block;
    width: 100%;
  }

  b {
    font-weight: 700;
  }

  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------------------------------------------------------------- the field */

  .board {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    border: var(--rule) solid var(--ink);
    margin: 18px;
  }

  .cell {
    border-bottom: var(--rule) solid var(--ink);
    padding: var(--pad);
    /* both minimums, so a grid item can be smaller than the thousand words inside it, and
       `overflow` so that if it ever is not, the words stop at the rule rather than printing
       over the footer */
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* one seam, at five-twelfths, down the whole board: the left column reads as prose and the
   right one as measurement */
  .cell.head {
    grid-column: span 5;
  }

  /* The row is as tall as the title beside it, which is taller than the sentence and its three
     figures. They are one unit -- the sentence ends in a colon the figures answer -- so the unit
     is centred in the box rather than hung from the top with the leftover printed underneath. */
  .cell.fig {
    grid-column: span 7;
    border-left: var(--rule) solid var(--ink);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .cell.say {
    grid-column: span 5;
  }

  .cell.chart {
    grid-column: span 7;
    border-left: var(--rule) solid var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* the wall is on the left and the chart it feeds on the right, which is the order the eye
     works in; both are placed on explicit lines rather than reordered in the markup, so the
     stacked layout below keeps the instruction above the words it is about */
  .cell.words {
    grid-column: 1 / span 5;
    grid-row: 3;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .cell.panel {
    grid-column: 6 / span 7;
    grid-row: 3;
    border-left: var(--rule) solid var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* the last content row and the footer share one rule rather than printing two */
  .cell.panel,
  .cell.words {
    border-bottom: 0;
  }

  .cell.foot {
    grid-column: span 12;
    border-top: var(--rule) solid var(--ink);
    border-bottom: 0;
    padding: 10px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 18px;
  }

  /* Two families and four steps, and what a thing IS decides which one it takes, not where it
     sits on the board:
       grotesk 700, tight     the title and the three figures -- what is the size of the page
       grotesk 500            every sentence the page says, in either box of prose
       grotesk 400, muted     the note under them
       mono 500, uppercase    every label on a measurement: the figures' captions, the week
                              under the pointer, a word's numbers, the axes, the footer
       mono, sized by lift    the words themselves, which are not labels but the data
     Two things are deliberately outside it: the chosen word, set in the mono of the column it
     came from at the size of a heading, and the numbers inside a sentence, which take the
     accent because they are what the sentence is about. */
  .label,
  .readout,
  .probe .meta {
    font: 500 11px/1.3 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------------------------------------------------------------- the corpus */

  h1 {
    margin: 0;
    font: 700 clamp(1.45rem, 3.1vw, 2.35rem)/1.5 var(--grotesk);
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }

  h1 em {
    font-style: normal;
    background: var(--accent);
    color: #fff;
    padding: 0 0.12em;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .stat b {
    display: block;
    font: 700 clamp(1.05rem, 2vw, 1.6rem)/1 var(--grotesk);
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }

  .stat .label {
    display: block;
    margin-top: 6px;
  }

  /* the three figures are told apart by the three primaries, not by three labels' worth of ink */
  .stat i {
    display: block;
    width: 100%;
    height: 6px;
    margin-bottom: 8px;
  }

  .stat:nth-child(1) i {
    background: #de301e;
  }

  .stat:nth-child(2) i {
    background: #0b5cab;
  }

  .stat:nth-child(3) i {
    background: #ffcf33;
  }

  /* ---------------------------------------------------------------- the clustering */

  /* the sentence above the figures is a sentence the page says, so it is set as one: the same
     step as the sentences in the next box, and only its measure and the room under it differ */
  .lede,
  .standfirst {
    margin: 0 0 8px;
    font: 500 clamp(1rem, 1.55vw, 1.2rem)/1.28 var(--grotesk);
    letter-spacing: -0.02em;
  }

  .standfirst {
    margin-bottom: 18px;
    max-width: 52ch;
  }

  .lede:last-of-type {
    margin-bottom: 0;
  }

  .lede b {
    color: var(--accent);
    font-weight: 700;
  }

  /* the one note on the board: what is left when a line is neither a sentence the page says
     nor a label on a number */
  .repo {
    margin: 16px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* one link rule for the whole board. The accent is spent on the figures, so a link keeps the
   ink and takes the accent as its underline instead of as its colour. */
  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
    /* one unbroken rule under the words: the gaps a descender cuts in an underline read as
       three short lines rather than one link */
    text-decoration-skip-ink: none;
  }

  a:hover,
  a:focus-visible {
    color: var(--accent);
  }

  /* ---------------------------------------------------------------- the charts */

  /* A finger dragged across a chart scrubs it, and the browser must be told so before the
     gesture starts. Left to itself Chrome on a phone reads the first sideways millimetre as a
     pan, takes the gesture and sends `pointercancel`: the line jumped once to where the finger
     landed and then vanished, and the readout fell back to the last week -- the chart answered
     a tap but could not be dragged. `pan-y` gives the sideways axis to the page's own handler
     and keeps the up-and-down one for scrolling, so the chart is scrubbed across and the page
     still scrolls past it. */
  .cell.chart svg,
  .probe svg {
    touch-action: pan-y;
  }

  .cell.chart svg {
    flex: 1;
    min-height: 150px;
    height: auto;
  }

  /* the week under the pointer belongs to the diagram, so it is printed at the head of the
   diagram's own cell rather than in a compartment of its own or in a tooltip that takes it
   away again. With no pointer on the chart the line asks for one. */
  .readout {
    margin: 0 0 10px;
    /* one line of room whether or not the week has been written into it yet: the chart is
       measured before it is drawn, and a readout that arrives afterwards would take its line
       out of the chart's own height and leave the drawing taller than the box holding it */
    min-height: 1.3em;
    color: var(--ink);
  }

  /* not a measurement, so not in the ink: the invitation takes the grey every other label on
     the board is set in, and a glance tells a reading from a prompt without reading either */
  .readout.nudge {
    color: var(--muted);
  }

  .readout b {
    color: var(--accent);
    font-weight: 500;
  }

  .axis {
    position: relative;
    height: 15px;
    margin-top: 7px;
    font: 500 10px/1.3 var(--mono);
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .axis span {
    position: absolute;
    top: 0;
    white-space: nowrap;
  }

  .axis span:first-child {
    left: 0;
  }

  .axis .last {
    right: 0;
  }

  /* the years inside the axis are a convenience; the two dates at the ends are not. On a narrow
   screen the year mark and the last week collide, and the year is the one the chart already
   draws as a rule of its own. */
  @media (max-width: 480px) {
    .axis .yr {
      display: none;
    }
  }

  /* the chosen word's own history. The scale is that word's own peak, printed beside it -- a
   shared scale would flatten every word except the handful of common ones, and these differ by
   three orders of magnitude. */
  .probe {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* the word on its own line and the measurements under it, always: side by side, the two
     collapse onto one line or fall onto two depending on how long the word is, and the panel
     changes shape as you move down the column */
  .probe .who {
    display: block;
  }

  .probe .word {
    display: block;
    font: 500 clamp(1.05rem, 1.6vw, 1.3rem)/1.2 var(--mono);
  }

  .probe .word b {
    color: var(--accent);
    font-weight: 500;
  }

  /* the multiple is the measurement in that line; it takes the ink rather than the accent,
     which is spent already on the word above it and on the band that arrives */
  .probe .meta b {
    color: var(--ink);
  }

  .probe .meta {
    display: block;
    margin-top: 7px;
  }

  /* the panel's own readout sits tighter to its chart than the stack's does to the board */
  .probe .readout {
    margin: 4px 0 4px;
  }

  .probe svg {
    flex: 1;
    min-height: 74px;
    height: auto;
    margin-top: 8px;
  }

  /* ---------------------------------------------------------------- the words */

  /* scrolling the column is choosing: the word crossing the middle of the box is the one
     drawn, so the wheel and a finger do the same thing. The scrollbar is hidden because the
     position in a thousand words is not the point — the word under the middle is. */
  .wall {
    /* one tick of a wheel, one word. The rows are snap points and none may be skipped, so a
       whatever moves the column, it comes to rest with a word's top on the chosen line. The
       padding puts the snap line where that line is, rather than at the box's top.

       `proximity` and not `mandatory`, and no `scroll-snap-stop`: both of those catch a flick
       and land it on the next word, which is a picker with no weight to it. A finger throws the
       column now and it carries, snapping only when it stops near a word anyway. Nothing rests
       on the snapping -- the chosen word is read off the scroll position, whatever it is. */
    scroll-snap-type: y proximity;
    scroll-padding-top: calc(50% - 14px);
    position: relative;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: none;
    min-height: 0;
    flex: 1;
    border: 1px solid var(--hairline);
    /* The right pad is the strip the frame's own marks stand in, and it is wider than the left
       for exactly that reason. A row is a block, so its box -- and the outline drawn on it when
       it is the chosen one -- runs the full width of the column whatever the word is; without
       the room it ran under the arrows and, once there was one, straight through the rail. It
       had always done it, at every width the board takes: the marks are a few pixels wide and
       an outline crossing them at their tips reads as a rendering fault, while an outline
       crossing a hairline the length of the box reads as one.

       The number is the marks' own geometry, taken at the worst case: they sit 35px in from the
       cell's edge, and the cell's padding is at its narrowest -- 15px, on a phone -- so 24 here
       clears them by five, and by eight on the board. */
    padding: 10px 24px 10px 12px;
  }

  .wall::-webkit-scrollbar {
    display: none;
  }

  /* Half a box of empty run at each end, less half a row, so the first and the last word can
     both reach the middle -- the first is the one the page is named after, and it must be
     reachable.

     It is content and not padding: padding is inside the border box, so a box carrying more of
     it than it is tall cannot shrink back when the layout changes under it, and the column ends
     up printing over the footer. */
  .wall::before,
  .wall::after {
    content: "";
    display: block;
  }

  /* the run above the first word says what the column is and what to do with it, quietly and in
     the lightest weight on the page. It scrolls away with the words themselves, which is the
     right lifetime for a nudge: it is gone the moment it has been taken */
  .wall::before {
    height: calc(50% - 14px);
    /* centred in the run on both axes, which is the same rule twice: the run is a box and a
       label in a box goes in the middle of it. Left-aligned it read as a first row of the list
       that had lost its word. */
    display: flex;
    align-items: center;
    justify-content: center;
    content: "scroll · most representative first";
    color: var(--muted);
    font: 400 10px/1.3 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* the run below is the taller one: the last word is the smallest on the wall, and a short box
     needs more room beneath it to bring its top up to the line */
  .wall::after {
    height: 50%;
  }

  /* two marks on the frame rather than a scrollbar: what they say is that this column moves,
     and that up and down are the keys for it. They keep the places they held when each was
     positioned on its own -- the box is ten wide around a six-wide glyph, so neither mark has
     moved and what is new is only the run between them. */
  .steps {
    position: absolute;
    right: 25px;
    top: 25px;
    bottom: 25px;
    width: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* the marks hold the ends of the run by `space-between` rather than by the rail's flex, so
       they stay where they are on the devices where the rail is not drawn at all */
    justify-content: space-between;
    /* the marks are marks: only the rail between them takes the pointer */
    pointer-events: none;
  }

  .step {
    color: var(--muted);
    font: 500 10px/1 var(--mono);
  }

  /* Where a scrollbar would be, doing the half of a scrollbar's job that is worth doing here.
     A thousand words is far too many for a thumb whose LENGTH means anything -- it would be a
     couple of pixels -- so the mark is a point: it says where in the thousand the chosen word
     is, and it can be taken and dragged there.

     Drawn only where there is a pointer fine enough to catch eight pixels of it. A finger has
     the whole column to throw, which is the same gesture with a target the size of the box. */
  .rail {
    display: none;
    flex: 1;
    width: 100%;
    position: relative;
    margin: 7px 0;
    cursor: pointer;
    pointer-events: auto;
    /* the drag belongs to the rail and not to the page, on a screen that could serve either */
    touch-action: none;
  }

  @media (hover: hover) and (pointer: fine) {
    .rail {
      display: block;
    }
  }

  /* the track is the lightest line on the page: a position is only legible against the run it
     is a position in, and the run must not read as a third mark on the frame.

     The half pixel is the only way the line and the thumb share a centre. The rail is ten wide
     and the thumb eight, so the thumb sits on whole numbers and centres on 5; a one-wide line
     centred on that same 5 begins at 4.5. Begun at 4 it ran half a pixel to the left of the
     thumb it is the run for, and a thumb eight wide is wide enough to be read against the line
     and show it. If one of the two must be off the grid it is the line: spread to two lighter
     columns where a pixel cannot be halved, a line this light loses nothing. */
  .rail::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 4.5px;
    width: 1px;
    background: #d8d8d8;
  }

  .rail:hover::before {
    background: #b0b0b0;
  }

  /* the accent, which on this board means the current selection and nothing else -- the same
     thing the outline around the word means, said as a position instead of as a word.

     Its travel is the run less its own height, so it reaches both ends of the rail without
     hanging past either, and `--p` is the chosen word's place in the thousand. */
  .rail i {
    position: absolute;
    top: calc((100% - 8px) * var(--p, 0));
    left: 1px;
    width: 8px;
    height: 8px;
    background: var(--accent);
  }

  /* a column, one word a line, tight enough that scrolling it is reading rather than paging */
  .wall span {
    display: block;
    scroll-snap-align: start;
    font-family: var(--mono);
    white-space: nowrap;
    line-height: 1.3;
    border: 1px solid transparent;
    padding: 1px 5px;
    margin: 0;
    cursor: pointer;
  }

  .wall span.on {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---------------------------------------------------------------- where a board fits

   The board is a board only where a board fits. Below this it is a document again: one column,
   the seams unprinted, the chart at a fixed height and the wall bounded so it cannot become
   the whole page. */
  @media (min-width: 1080px) and (min-height: 720px) {
    .board {
      height: calc(100dvh - 36px);
      margin-bottom: 18px;
      grid-template-rows: auto minmax(0, 1.15fr) minmax(0, 1fr) auto;
    }
  }

  @media (max-width: 1079px),
  (max-height: 719px) {

    /* every span named again rather than `.cell` once: a bare `.cell` here loses to `.cell.head`
     on specificity and the board would stay a board */
    .cell.head,
    .cell.fig,
    .cell.say,
    .cell.chart,
    .cell.panel,
    .cell.words {
      grid-column: span 12;
      grid-row: auto;
      border-left: 0;
    }

    /* Stacked, the column and the chart it feeds keep the height they have side by side on the
       board: one pair, one size. The column fills whatever the cell gives it, so the size is
       stated once and the two cannot drift apart.

       That the height is fixed at all is the other half of it: the chart keeps it whether a
       word is chosen or not, so choosing one does not shift the column under the finger that
       chose it, and the measurements are given their two lines whether they need one or two. */
    .cell.panel,
    .cell.words {
      height: 268px;
    }

    .cell.panel {
      border-bottom: var(--rule) solid var(--ink);
      justify-content: flex-start;
    }

    .probe .meta {
      min-height: 2.8em;
    }

    .cell.chart svg {
      height: 260px;
    }

  }

  @media (max-width: 700px) {
    :root {
      --rule: 2px;
      --pad: 14px 15px;
    }

    body {
      font-size: 16px;
    }

    .board {
      margin: 10px;
    }

    h1 {
      font-size: clamp(1.35rem, 7.2vw, 2rem);
    }

    .standfirst {
      margin-bottom: 14px;
    }

    /* one figure to a line on a phone: two across leaves the third sitting alone under them,
       which reads as a fourth column that failed rather than as three of a kind */
    .stats {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .stat b {
      font-size: 1.3rem;
    }

    .cell.chart svg {
      height: 200px;
    }

    .cell.foot {
      padding: 9px 15px;
    }

  }
</style>

<div id="app"></div>

<script>
  const DATA = "analysis.js";
  let A = null, T = null;
  const HALFROW = 14;                        // half a row: how far the line sits above centre
  const THUMB = 8;                           // the mark on the rail, square; `.rail i` agrees
  const S = { j: 0 };                        // the chosen word: the first one, until it is not                     // the chosen word, or null for nothing chosen
  const app = document.getElementById("app");
  const fmt = n => Math.round(n).toLocaleString("en-US");
  /* two significant figures however small, because the point of the smallest share is that it is
     nearly zero and "0.0%" hides that */
  const pc = v => {
    const x = v * 100;
    return (x >= 10 ? x.toFixed(0) : x >= 1 ? x.toFixed(1) : x >= 0.01 ? x.toFixed(2)
      : x.toPrecision(2)) + "%";
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ramp = (from, to, n) => {
    const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const a = hex(from), b = hex(to);
    return Array.from({ length: n }, (_, i) => {
      const t = n === 1 ? 0 : i / (n - 1);
      return "#" + a.map((v, k) => Math.round(v + (b[k] - v) * t)
        .toString(16).padStart(2, "0")).join("");
    });
  };
  /* one grey ramp for the seven clusters that were always there, the accent for the one that
     arrives; the seam is hairline so eight bands do not read as eight rules */
  const TH = { ramp: ramp("#7d7d7d", "#e6e6e6", 7), seam: 0.8, dash: "1 4", stroke: 1.6 };

  /* ------------------------------------------------------------------ the charts */

  /* Idle, the line above a chart says what the chart will do rather than standing a number in
     the place where a reading goes. It used to hold the last week, which is a fact the board
     never meant to assert -- the newest week is not what either chart is about -- and it hid
     the one thing a reader who has not touched the chart yet needs to know, which is that the
     chart answers at all.

     The verb is the one the device actually has: a phone cannot hover and a mouse cannot
     touch, and a nudge naming the wrong gesture is worse than no nudge. It is read at each
     rest rather than once at load, so a tablet that gains a mouse is told the truth from then
     on. */
  const nudge = () => matchMedia("(hover: hover)").matches
    ? "hover to see a week" : "touch to see a week";

  /* The line is either a reading or the invitation to take one, and it is set as whichever it
     is: a reading in the ink, the invitation in the muted grey the board's other labels take,
     so a glance can tell a measurement from a prompt without reading either. */
  function readout(el, html) {
    if (!el) return;
    el.innerHTML = html || nudge();
    el.classList.toggle("nudge", !html);
  }

  /* Both charts are scrubbed the same way, so the wiring is written once: the line follows the
     pointer across the box, and off it the chart goes back to its invitation.

     The pointer is captured on the way down for anything that is not a mouse. A finger dragged
     sideways does not travel in a straight line -- it drifts up or down out of a chart 200px
     tall -- and without the capture those events go to whatever is underneath, the line stops
     dead half way across and the readout freezes. Captured, the chart keeps the gesture until
     the finger lifts. A mouse is left alone: it has a real leave event and hovering off the
     chart is how it says it is done.

     `pointerup` rests the chart only for a finger. With a mouse the pointer is still over the
     chart after a click, so blanking the line there would take it away from a cursor that is
     still pointing at it. */
  function scrubbing(svg, N, say, rest) {
    const idle = () => { svg.querySelector(".cross").setAttribute("opacity", "0"); rest(); };
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(N - 1,
        Math.round(((ev.clientX - r.left) / r.width) * (N - 1))));
      const cr = svg.querySelector(".cross");
      cr.setAttribute("x1", ((i / (N - 1)) * r.width).toFixed(1));
      cr.setAttribute("x2", ((i / (N - 1)) * r.width).toFixed(1));
      cr.setAttribute("opacity", "0.6");
      say(i);
    };
    svg.onpointerdown = ev => {
      if (ev.pointerType !== "mouse" && svg.setPointerCapture) {
        try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* not capturable: leave it */ }
      }
      move(ev);
    };
    svg.onpointermove = move;
    svg.onpointerup = ev => { if (ev.pointerType !== "mouse") idle(); };
    svg.onpointerleave = svg.onpointercancel = idle;
  }

  /* One area chart from one word's weekly rate, scaled to `hi`. The unit is written into
     the labels rather than passed in: this draws the word panel's chart and nothing else,
     and the stack above it is its own function. */
  function area(svg, vals, hi) {
    const w = svg.clientWidth || 800, h = svg.clientHeight || 74, N = vals.length;
    const x = i => (i / (N - 1)) * w, y = v => h - (v / (hi || 1)) * (h - 2);
    let d = `M0,${y(vals[0]).toFixed(1)}`;
    vals.forEach((v, i) => { d += `L${x(i).toFixed(1)},${y(v).toFixed(1)}`; });
    // the peak reads off the chart's own scale rather than out of a sentence beside it: one
    // rule at the top of the curve, carrying the number the height stands for. No rule where
    // the year turns -- the axis says where 2026 begins, and a full-height bar through the
    // curve was reading as data.
    const top = y(hi);
    svg.innerHTML = `<path d="${d}L${w},${h}L0,${h}Z" fill="var(--fill)"/>` +
      `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="${TH.stroke}"/>` +
      `<line x1="0" x2="${w}" y1="${top.toFixed(1)}" y2="${top.toFixed(1)}"
      stroke="var(--ink)" stroke-width="1" stroke-dasharray="${TH.dash}" opacity="0.34"/>` +
      `<text x="6" y="${(top + 12).toFixed(1)}" fill="var(--ink)" opacity="0.62"
      font-size="10" font-family="var(--mono)">${fmt(hi)} per million, at the peak</text>` +
      `<line x1="0" x2="${w}" y1="${h - 0.5}" y2="${h - 0.5}" stroke="var(--ink)"
      stroke-width="1"/>` +
      `<line class="cross" x1="0" x2="0" y1="0" y2="${h}" stroke="var(--ink)"
      stroke-width="1" opacity="0"/>`;

    // a finger or a pointer on this chart reads out its week, the same gesture and the same
    // line as the stack above it. Idle, it asks for the gesture.
    const out = app.querySelector(".probe .readout");
    const at = i => `week ${A.weeks[i]} · <b>${fmt(vals[i])}</b> per million words`;
    scrubbing(svg, N, i => readout(out, at(i)), () => readout(out, null));
    readout(out, null);
  }

  /* The stack, as a share of each week. Every band is one cluster of vocabulary and they fill the
     height; the arrival sits at the bottom, so its growth reads as a rising floor rather than a
     shape squeezed between others. Normalising per week is safe here: every day contributes one
     full page of descriptions, so the denominator is near constant and a band cannot appear to
     shrink merely because the week around it grew. */
  function stack(svg) {
    const w = svg.clientWidth || 800, h = svg.clientHeight || 300, N = A.weeks.length;
    const tot = A.weeks.map((_, i) => A.components.reduce((s, c) => s + c.count[i], 0) || 1);
    const x = i => (i / (N - 1)) * w;
    let acc = new Array(N).fill(0), out = "", k = 0;
    for (const c of A.components) {
      const top = c.count.map((v, i) => acc[i] + v / tot[i]);
      let d = `M0,${(h - acc[0] * h).toFixed(1)}`;
      for (let i = 0; i < N; i++) d += `L${x(i).toFixed(1)},${(h - top[i] * h).toFixed(1)}`;
      for (let i = N - 1; i >= 0; i--) d += `L${x(i).toFixed(1)},${(h - acc[i] * h).toFixed(1)}`;
      out += `<path d="${d}Z" fill="${c.lead ? "var(--accent)" : TH.ramp[k++ % TH.ramp.length]}"
             stroke="var(--ground)" stroke-width="${TH.seam}"/>`;
      acc = top;
    }
    let rules = "";
    for (const f of [0.25, 0.5, 0.75]) {
      const y = h - f * h;
      rules += `<line x1="0" x2="${w}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
               stroke="var(--ink)" stroke-width="1" stroke-dasharray="${TH.dash}"
               opacity="0.34"/>`
        + `<text x="6" y="${(y - 5).toFixed(1)}" fill="var(--ink)" opacity="0.62"
               font-size="10" font-family="var(--mono)">${f * 100}%</text>`;
    }
    svg.innerHTML = out + rules + `<line class="cross" x1="0" x2="0" y1="0" y2="${h}"
    stroke="var(--ink)" stroke-width="1" opacity="0"/>`;
    const lead = A.components.find(c => c.lead);
    const at = i => `week ${A.weeks[i]} · <b>${pc(lead.count[i] / tot[i])}</b> of the week`;
    // pointer events rather than mouse events, so a finger dragged across the chart scrubs it and
    // a tap on it reads out one week
    scrubbing(svg, N, i => week(at(i)), () => week(null));
    week(null);
  }

  /* The week reads out at the head of the chart's own cell. Off the chart the line carries the
     invitation instead, so it is never an empty row of the board and never a stale one. */
  function week(html) {
    readout(app.querySelector(".cell.chart .readout"), html);
  }

  /* ------------------------------------------------------------------ the word panel */

  function paint() {
    const c = T.lead, p = app.querySelector(".probe");
    if (!p) return;
    /* A RATE, not a count: appearances per million words written that week. The corpus runs
       from 37,000 words in a week to 129,000, so a curve of raw counts draws the corpus
       growing wherever it draws the word arriving, and the two cannot be told apart by
       looking. Dividing each week by the words in it leaves the word's own shape. */
    const s = c.series[S.j];
    const freq = s.map((v, t) => 1e6 * v / (A.words_per_week[t] || 1));
    const overall = 1e6 * s.reduce((a, b) => a + b, 0) / Math.max(A.appearances, 1);
    p.querySelector(".word").innerHTML = `<b>${esc(c.word_list[S.j])}</b>`;
    p.querySelector(".meta").innerHTML =
      `<b>${c.word_lift[S.j]}×</b> more frequent in this component<br>`
      + `${fmt(overall)} per million words across the corpus`;
    area(p.querySelector("svg"), freq, Math.max(...freq));
    app.querySelectorAll(".wall .on").forEach(n => n.classList.remove("on"));
    app.querySelectorAll(`[data-j="${S.j}"]`).forEach(n => n.classList.add("on"));
    /* the mark on the rail is this same choice as a position. It is set as a fraction and
       placed by the layout rather than measured here: the rail's height is whatever the box
       gives it, and a number read back per frame would only be that height again. */
    const rail = app.querySelector(".rail");
    if (rail) rail.style.setProperty("--p", (S.j / (T.words.length - 1)).toFixed(4));
  }

  /* One entry point for choosing a word, whether it was clicked, scrolled to or stepped to. */
  function pick(j, reveal) {
    S.j = j;
    paint();
    if (reveal) {
      const wall = app.querySelector(".wall");
      if (wall) bring(wall, j);
    }
  }

  /* The row offsets, from the layout rather than from anything measured per frame. They only
     change when the layout does, so they are cached and dropped in `render`. */
  let rowTop = null;
  function rows(wall) {
    if (!rowTop) rowTop = [...wall.querySelectorAll("[data-j]")].map(el => el.offsetTop);
    return rowTop;
  }

  /* Where the chosen line is, and what sits on it is the TOP of a word's box rather than its
     middle: the words are set in the size of their lift, so a box centred on a line jumps up and
     down by however tall the word inside it happens to be. Its top does not.

     It is measured off the box and not off the empty run above the words: `getComputedStyle` on
     a pseudo-element is not something every browser answers with a used height, and a wrong
     answer here would put the word somewhere other than where it is read back from. */
  function line(wall) {
    return wall.clientHeight / 2 - HALFROW;
  }

  /* The word on the line is the one whose top is NEAREST to it, rather than the last one whose
     top is above it. Rounding lands exactly on that comparison: `offsetTop` is a whole number,
     the run above the words is fractional, and a browser snaps `scrollTop` to physical pixels --
     so a word scrolled to the line could measure a hair short of its own edge and hand the
     choice to the word above it. A miss of half a pixel cannot reach the next word's top. */
  function middle(wall) {
    const top = rows(wall), y = wall.scrollTop + line(wall);
    let lo = 0, hi = top.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (top[m] <= y) lo = m; else hi = m - 1; }
    return lo < top.length - 1 && top[lo + 1] - y < y - top[lo] ? lo + 1 : lo;
  }

  /* Bring a word to the line by scrolling the column and nothing else. `scrollIntoView` would
     scroll every scrollable ancestor with it, which on a phone means the page jumps and the
     chart the word was chosen for leaves the screen; and it centres the row, which is only the
     line on the board. */
  function bring(wall, j) {
    wall.scrollTop = rows(wall)[j] - line(wall);
  }

  function axis() {
    let out = `<span>${A.weeks[0]}</span>`;
    A.weeks.forEach((wk, i) => {
      if (i && wk.slice(0, 4) !== A.weeks[i - 1].slice(0, 4)) {
        const p = (i / (A.weeks.length - 1)) * 100;
        if (p > 8 && p < 88) out += `<span class="yr" style="left:${p.toFixed(1)}%">`
          + `${wk.slice(0, 4)}</span>`;
      }
    });
    return out + `<span class="last">${A.weeks[A.weeks.length - 1]}</span>`;
  }

  /* ------------------------------------------------------------------ the content */

  function prep() {
    const lead = A.components.find(c => c.lead);
    const W = A.lead_window;
    const sum = a => a.reduce((s, v) => s + v, 0);
    // the share is read off the last `W` weeks, not the last one: a week is 700 descriptions and
    // the headline should not turn on which of two close clusters led across one of them
    const monthDocs = sum(A.docs_per_week.slice(-W));
    const monthShare = monthDocs ? pc(sum(lead.count.slice(-W)) / monthDocs) : "—";
    // log scale, because measuring lift against everything-else spreads it over three orders of
    // magnitude and on a linear ramp every word past the first dozen would sit at the minimum
    const lg = Math.log, hiL = lead.word_lift[0], loL = lead.word_lift[lead.word_lift.length - 1];
    const sp = Math.max(lg(hiL) - lg(loL), 1e-9);
    const words = lead.word_list.map((w, j) => ({
      j, w, t: (lg(lead.word_lift[j]) - lg(loL)) / sp,
    }));

    return {
      lead, words,
      stats: [{ v: fmt(A.days), k: "days" },
      { v: fmt(A.documents), k: "pull requests" },
      { v: fmt(A.appearances), k: "words" }],
      // the method is the sentence's last clause rather than a paragraph under it: what was
      // done is a link away, and the page says it once
      divided: `We clustered GitHub PRs since 2025 into <b>${A.k}</b> clusters of vocabulary using `
        + '<a href="https://jmlr.csail.mit.edu/papers/volume6/banerjee05b/banerjee05b.pdf">KL-divergence k-means</a>.',
      share: `One of the clusters appeared in 2026 and represented <b>${monthShare}</b> of all human-attributed pull requests last month.`,
      familiar: `Its most representative words should look <a href="https://github.com/anthropics/claude-code/issues/53454">familiar</a> `
        + "to anyone who uses coding agents.",
      // the cloud: size and opacity by lift, on the log scale
      wall: () => `<div class="wall">` + words.map(({ j, w, t }) =>
        `<span data-j="${j}" style="font-size:${(10.5 + 8 * t).toFixed(1)}px;`
        + `opacity:${(0.45 + 0.55 * t).toFixed(2)}">${esc(w)}</span>`).join("") + `</div>`,
    };
  }

  /* ------------------------------------------------------------------ the page */

  function build() {
    app.innerHTML = `<div class="board">
    <div class="cell head">
      <h1>The <em>load-bearing</em> vocabulary of Claude</h1>
    </div>
    <div class="cell fig">
      <p class="standfirst">We scrape 100 GitHub Pull Requests daily to analyse trends in
        vocabulary.<br>So far we have analysed:</p>
      <div class="stats">${T.stats.map(s => `<div class="stat"><i></i><b>${s.v}</b>`
      + `<span class="label">${s.k}</span></div>`).join("")}</div>
    </div>
    <div class="cell say">
      <p class="lede">${T.divided}</p>
      <p class="lede">${T.share}</p>
      <p class="lede">${T.familiar}</p>
      <p class="repo"><a href="https://github.com/louisabraham/load-bearing">Full code and methodology write-up</a>.</p>
    </div>
    <div class="cell chart">
      <p class="readout"></p>
      <svg id="stack"></svg>
      <div class="axis">${axis()}</div>
    </div>
    <div class="cell panel empty">
      <div class="probe"><div class="who"><span class="word"></span>
        <span class="label meta"></span></div>
        <p class="readout"></p><svg></svg>
        <div class="axis">${axis()}</div></div>
    </div>
    <div class="cell words">
      ${T.wall()}
      <div class="steps" aria-hidden="true"><span class="step">▲</span>
        <div class="rail"><i></i></div>
        <span class="step">▼</span></div>
    </div>
    <div class="cell foot"><span class="label">generated ${A.generated}</span>
      <span class="label">Made with ❤️ by <a href="https://louisabraham.github.io/">Louis Abraham</a></span></div>
  </div>`;

    // a click keeps the word, so the panel can be read with both hands off the mouse, and the
    // wall is one tab stop with the arrows moving inside it rather than a thousand tab stops
    const wall = app.querySelector(".wall");
    wall.setAttribute("aria-label", "the thousand most characteristic words");
    wall.addEventListener("click", ev => {
      const el = ev.target.closest("[data-j]");
      if (el) pick(+el.dataset.j, true);
    });
    wall.addEventListener("scroll", () => {
      const j = middle(wall);
      if (j !== S.j) pick(j);
    });
    // A wheel with detents asks for one word, not for the hundred pixels the browser would give
    // it, which is five of them. A trackpad is left alone: it asks in pixels, and the column
    // moves as far as the finger did and settles on a word by snapping.
    wall.addEventListener("wheel", ev => {
      if (ev.deltaMode === 0 && Math.abs(ev.deltaY) < 40) return;
      ev.preventDefault();
      const to = S.j + Math.sign(ev.deltaY);
      if (to >= 0 && to < T.words.length) pick(to, true);
    }, { passive: false });
    // The rail is a handle as well as a reading: the mark can be taken and dragged along it,
    // and a press anywhere on it goes to that place at once. The mark centres on the pointer
    // either way, so pressing and dragging are one gesture rather than two behaviours.
    const rail = app.querySelector(".rail");
    const along = ev => {
      const box = rail.getBoundingClientRect(), run = box.height - THUMB;
      const t = run > 0 ? (ev.clientY - box.top - THUMB / 2) / run : 0;
      pick(Math.round(Math.min(1, Math.max(0, t)) * (T.words.length - 1)), true);
    };
    rail.addEventListener("pointerdown", ev => {
      // capture is what lets the drag leave the ten pixels the rail is wide and carry on, which
      // is how every other slider behaves and the only way a drag down a long column is usable
      rail.setPointerCapture(ev.pointerId);
      ev.preventDefault();                 // a drag on the frame is not a selection of the words
      along(ev);
    });
    rail.addEventListener("pointermove", ev => {
      if (rail.hasPointerCapture(ev.pointerId)) along(ev);
    });
    // up and down step the choice, and centring it scrolls the column to match, so the two
    // ways of moving cannot disagree about which word is chosen
    addEventListener("keydown", ev => {
      if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") return;
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      // where the page itself scrolls -- the stacked layout -- the arrows belong to the page
      if (document.documentElement.scrollHeight > innerHeight + 1) return;
      ev.preventDefault();
      const to = S.j + (ev.key === "ArrowDown" ? 1 : -1);
      if (to >= 0 && to < T.words.length) pick(to, true);
    });
    // the row offsets are read off the box, and the box changes with the window, with the
    // orientation and with the media query the board switches on -- a debounced resize handler
    // sees only the first of those. Nothing here writes to the box, so nothing can loop.
    if (self.ResizeObserver) new ResizeObserver(() => { rowTop = null; }).observe(wall);
    render();
  }

  /* The charts are measured from the layout, so they are drawn after it and again when it
     changes. The chosen word survives both. */
  function render() {
    const svg = app.querySelector("#stack");
    if (svg && svg.clientWidth) stack(svg);
    rowTop = null;
    paint();
  }

  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 150); });

  const tag = document.createElement("script");
  tag.src = DATA;
  tag.onload = () => {
    A = window.ANALYSIS;
    if (!A) return fail();
    T = prep();
    build();
  };
  tag.onerror = fail;
  document.head.appendChild(tag);

  function fail() {
    app.innerHTML = `<p style="padding:80px 24px;font-family:ui-monospace,monospace">`
      + `<b>${DATA}</b> not found.<br>Run <b>python analyze.py</b> first.</p>`;
  }
</script>
