        <kbd class="key" aria-hidden="true">/</kbd>
        <button class="clear" type="button" aria-label="clear the filter">×</button>
      </div>
      <div class="column">
        <div class="wall" id="wall">${V.wall()}</div>
        <div class="steps" aria-hidden="true"><span class="step">▲</span>
          <div class="rail"><i></i></div>
          <span class="step">▼</span></div>
      </div>
    </div>
    <div class="cell foot"><span class="label">generated ${A.generated}</span>
      <span class="label">Made with ❤️ by <a href="https://louisabraham.github.io/">Louis Abraham</a></span></div>
  </div>`;

    // a click keeps the word, so the panel can be read with both hands off the mouse, and the
    // wall is one tab stop with the arrows moving inside it rather than a thousand tab stops
    const wall = app.querySelector(".wall");
    // not "the thousand": the arrival lists a thousand words and the other eleven list a
    // hundred and fifty, and the label has to be true of whichever the reader has stepped to
    wall.setAttribute("aria-label", "the most characteristic words of the chosen cluster");
    /* The tab stop the line above has always claimed, and never was. Nothing in the cell was
       focusable, so a click on a word focused nothing -- and an arrow key afterwards belonged to
       whatever the browser guessed, which is the bug the guard further down describes. */

    wall.addEventListener("click", ev => {
      const el = ev.target.closest("[data-j]");

       give it, which is five of them. A trackpad is left alone: it asks in pixels, and the
       column moves as far as the finger did and settles on a word by snapping.

       The delta is put into PIXELS first, because the test under it is a test on a distance
       and only one of the three units a delta arrives in is one. `deltaMode` was read as if it
       named the device -- pixels meaning something continuous, anything else a detent -- and it
       does not: Firefox reports a wheel in LINES, and a high-resolution wheel reports fractions
       of a line. Every one of those fractions failed the `deltaMode === 0` clause, took this
       branch, and moved a whole word, because `Math.sign` had thrown the magnitude away before
       anything could notice how small it was. Six detents' worth of a wheel reporting tenths of
       a line moved sixty words. Converted, that same spin is 4px an event and the browser gets
       it, which is what it was always meant to get.

       Forty pixels to the line is the constant every library that has had to do this converged
       on, and it is not picked but fitted: three lines is a wheel tick in Firefox and 120px is
       a wheel tick in Chrome, so at forty a detent is the same distance whichever unit it
       arrives in -- and a tick, however it is reported, still lands on this side of the test. A
       page is the box, which is what a page means to something that scrolls.

       That the line is forty pixels and the floor below is forty pixels is a coincidence of two
       unrelated numbers: one is how big a line is, the other is how big a delta has to be
       before it is a notch rather than a nudge.

       The delta has to be small enough to be a notch as well as big enough. There was only a
       floor, so a delta of ANY size above it moved exactly one word -- and a device that
       delivers its distance in few large events therefore moved the column less the faster it
       was spun. One event carrying 720px moved one word; the same 720px arriving in events
       small enough to be handed to the browser moved the whole 720, which is thirty-odd words
       of this column. Thirty times the travel for the same gesture, decided by nothing but how
       finely the device chopped it. Over the ceiling it is not a notch and never was, so it
       goes back to the browser, which scrolls it the distance it asked for.

       This does not make the two sides of the floor agree -- a wheel notch is deliberately one
       word rather than the six that 120px of column would be, so travel is not proportional
       here and is not meant to be. What it does is stop the disagreement growing without limit
       in the one direction where it had no bound at all. */

      ev.preventDefault();
      step(Math.sign(ev.deltaY));
    }, { passive: false });
    // The rail is a handle as well as a reading: the mark can be taken and dragged along it,
    // and a press anywhere on it goes to that place at once. The mark centres on the pointer
    // either way, so pressing and dragging are one gesture rather than two behaviours.
    const rail = app.querySelector(".rail");
    const along = ev => {
      // the run is the run of the column beside it, so a filtered column is dragged in the
      // words it is showing rather than in the thousand it came from
      const { js } = rows(wall);
      if (!js.length) return;
      const box = rail.getBoundingClientRect(), run = box.height - THUMB;
      const t = run > 0 ? (ev.clientY - box.top - THUMB / 2) / run : 0;
      pick(js[Math.round(Math.min(1, Math.max(0, t)) * (js.length - 1))], true);
    };
    rail.addEventListener("pointerdown", ev => {
      // capture is what lets the drag leave the ten pixels the rail is wide and carry on, which
      // is how every other slider behaves and the only way a drag down a long column is usable
      rail.setPointerCapture(ev.pointerId);
      ev.preventDefault();                 // a drag on the frame is not a selection of the words
      along(ev);
    });
    rail.addEventListener("pointermove", ev => {
      if (rail.hasPointerCapture(ev.pointerId)) along(ev);
    });
    /* Up and down step the choice, and centring it scrolls the column to match, so the two ways
       of moving cannot disagree about which word is chosen.

       The old guard stood aside wherever the PAGE scrolls, on the grounds that the arrows are
       the page's there. They were not: a click inside a scroller is what makes it the browser's
       keyboard scroll target, so the arrows went to the COLUMN -- and a native arrow scroll is a
       LINE, which is not a word. Safari moved the choice two words a press and Firefox three,
       from anywhere in the column, while the page it was supposedly scrolling never moved at
       all. Chromium was the one engine that looked right, and only because it snaps a keyboard
       scroll to the nearest snap point; the bug was invisible in the browser the tests run in.

       So the question is who holds the focus, which is answerable -- and the column can now be
       asked, because it is a tab stop as of a few lines up. The second clause keeps the board:
       there the page does not scroll, the arrows can mean nothing but the column, and a reader
       who has clicked nothing still gets them. */
    /* The two arrows over the chart, and the two keys that are the same gesture without the
       reach. `mousedown` is left alone so the button can take the focus and be tabbed to; what
       is prevented is the focus RING stealing the eye on a click, which is `:focus-visible`'s
       job and not something to write here. */
    app.querySelectorAll(".pager .arrow").forEach((b, i) => {
      b.addEventListener("click", ev => {
        /* a swipe that happens to end over an arrow is not also a press of it: the board would
           step once for the travel and once more for the release. `detail` is what tells the two
           apart -- a click from a pointer carries a count and a click from the keyboard carries
           none, so a reader who has tabbed to the arrow is never answering for a finger. */
        if (swept && ev.detail) return;
        hold(S.c + (i ? 1 : -1));
      });
    });
    dragging(app.querySelector(".pager"));
    pager(S.c);
    /* Left and right step the cluster, from anywhere.

       They need none of the guard the up and down keys carry two blocks below. That guard
       exists because a native arrow scroll is a LINE and the column is a scroller, so up and
       down had to be asked who owned them; left and right scroll nothing on this page -- there
       is no horizontal overflow anywhere on the board -- and there is nothing for them to be
       taken from. Only a text field, where they are a caret and must stay one. */
    addEventListener("keydown", ev => {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      ev.preventDefault();
      hold(S.c + (ev.key === "ArrowRight" ? 1 : -1));
    });
    addEventListener("keydown", ev => {
      if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") return;
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      if (document.activeElement !== wall
        && document.documentElement.scrollHeight > innerHeight + 1) return;
      ev.preventDefault();
      step(ev.key === "ArrowDown" ? 1 : -1);
    });
    /* The field. `input` rather than `keyup`: it is the one event that also fires for a paste,
       for a drop, and for the phone keyboard's own completion, and every one of those is a
       query the column should already have narrowed to. */
    const find = app.querySelector(".find"), q = find.querySelector("input");
    q.addEventListener("input", () => filter(q.value));
    find.querySelector(".clear").addEventListener("click", () => {
      q.value = "";
      filter("");
      q.focus();                          // clearing a field is not leaving it
    });
    /* Up and down belong to the field while it has the focus: typing three letters and then
       stepping through what is left is one gesture, and sending the reader to the column to do
       the stepping would cost a tab and, on a phone, give the keyboard back for nothing.

       Enter has nothing to submit, so it means done -- and what "done" is worth on a phone is
       the half of the screen the keyboard is standing on. Escape empties the field, and empties
       the reader out of it once there is nothing left to empty. */

      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();

       otherwise be typed into nothing, and never from a modifier -- the browser's own find is
       the browser's. */
    addEventListener("keydown", ev => {
      if (ev.key !== "/" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      ev.preventDefault();
      q.focus();
      q.select();
    });
    // the row offsets are read off the box, and the box changes with the window, with the
    // orientation and with the media query the board switches on -- a debounced resize handler
    // sees only the first of those. Nothing here writes to the box, so nothing can loop.
    if (self.ResizeObserver) new ResizeObserver(() => { shown = null; }).observe(wall);

  }

  /* The charts are measured from the layout, so they are drawn after it and again when it
