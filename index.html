<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The load-bearing vocabulary of Claude</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
/* Two colours carry meaning rather than identity. Sixteen stacked bands cannot each have a
   hue -- a sixteen-step single-hue ramp holds neither adequate lightness gaps nor both ends
   visible against the surface -- so the bands are one muted tone and the accent is reserved
   for the component that arrives. Both are contrast-checked against both surfaces: the
   accent clears 3:1 as a mark on each ground, and `muted` is the darkest step that also
   clears 4.5:1 for body text on paper. */
:root {
  --ground:#f4f1ea; --ink:#14110f; --muted:#6b6459; --accent:#e8452c;
  --hairline:#ddd7ca; --band:#c9c1b2; --fill:#e8452c2e;
  --sans: ui-sans-serif, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --ground:#14110f; --ink:#f4f1ea; --muted:#a39b8e; --accent:#f0563a;
          --hairline:#302b26; --band:#3d372f; --fill:#f0563a33; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
       font:400 18px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
.wrap { max-width:1020px; margin:0 auto; padding:0 24px 96px; }
.exp { background:var(--accent); color:var(--ground); padding:14px 24px;
       font:500 13px/1.55 var(--mono); }
.exp b { font-weight:700; } .exp a { color:var(--ground); }
.exp.warn { background:var(--ink); }
header { padding:72px 0 0; }
h1 { margin:0; font-weight:900; letter-spacing:-0.035em; line-height:0.9;
     font-size:clamp(2.2rem,6.6vw,4.4rem); text-transform:uppercase; }
h1 em { font-style:normal; color:var(--accent); }
.standfirst { margin:28px 0 0; max-width:62ch; font-size:clamp(1.05rem,2.1vw,1.28rem); }
.label { font:500 11px/1.3 var(--mono); text-transform:uppercase;
         letter-spacing:0.12em; color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
         margin:40px 0 0; border-top:4px solid var(--ink); border-bottom:4px solid var(--ink); }
.stat { padding:18px 20px 16px; border-right:1px solid var(--hairline); }
.stat:last-child { border-right:0; }
.stat b { display:block; font-size:2rem; font-weight:900; letter-spacing:-0.02em; }
section { border-top:4px solid var(--ink); margin-top:56px; padding-top:22px; }
h2 { font:900 clamp(1.4rem,3vw,2rem)/1.1 var(--sans); letter-spacing:-0.025em; margin:0 0 8px; }
.note { color:var(--muted); max-width:66ch; margin:0 0 20px; font-size:0.95rem; }
.chart svg { display:block; width:100%; height:280px; }
.axis { position:relative; height:15px; margin-top:6px; }
.axis span { position:absolute; top:0; white-space:nowrap; }
.axis .last { right:0; }

/* the word chart: fixed above the wall, so hovering a word never moves the thing you are
   reading, and there is room for a real chart rather than a tooltip-sized one */
.probe { border:1px solid var(--hairline); padding:14px 16px 10px; margin:0 0 18px;
         position:sticky; top:0; background:var(--ground); z-index:5; }
.probe .who { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
              flex-wrap:wrap; }
.probe .word { font:500 1.1rem/1.2 var(--mono); }
.probe .word b { color:var(--accent); font-weight:500; }
.probe svg { display:block; width:100%; height:90px; margin-top:8px; }

.wall span { display:inline-block; font-family:var(--mono); margin:0 7px 5px 0;
             white-space:nowrap; cursor:default; }
.wall span:hover, .wall span.on { color:var(--accent); }
footer { border-top:4px solid var(--ink); margin-top:56px; padding-top:24px; }
footer p { max-width:66ch; margin:0 0 14px; }
footer code { font:500 0.9em var(--mono); }
footer a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--accent);
           text-underline-offset:2px; }
footer a:hover { color:var(--accent); }
.maths { margin-top:34px; border-top:1px solid var(--hairline); padding-top:20px; }
.maths dl { margin:0; }
.maths dt { margin:22px 0 0; }
.maths dd { margin:6px 0 0; color:var(--muted); font-size:0.95rem; max-width:66ch; }
.maths .tex { font:500 13px/1.7 var(--mono); color:var(--muted);
              white-space:pre-wrap; overflow-x:auto; }
.katex-display { margin:0.4em 0; overflow-x:auto; overflow-y:hidden; }
#tip { position:fixed; pointer-events:none; opacity:0; z-index:10; background:var(--ink);
       color:var(--ground); padding:7px 9px; font:500 11px/1.45 var(--mono);
       white-space:nowrap; }
#tip.on { opacity:1; }
</style>

<div class="wrap" id="app"></div>
<div id="tip"></div>

<script>
const DATA = "analysis.js";
let A = null;
const app = document.getElementById("app");
const tip = document.getElementById("tip");
const fmt = n => Math.round(n).toLocaleString("en-US");
/* two significant figures however small, because the point of the first number is that it is
   nearly zero and "0.0%" hides that */
const pc = v => { const x = v * 100;
  return (x >= 10 ? x.toFixed(0) : x >= 1 ? x.toFixed(1) : x >= 0.01 ? x.toFixed(2)
          : x.toPrecision(2)) + "%"; };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* One area chart from one series, scaled to `hi`. Used for the stack's bands, the arrival's
   own curve and every word's history, so they all read the same way. */
function area(svg, vals, hi, colour, pad) {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 90, T = vals.length;
  const bot = h - (pad || 0);
  const x = i => (i / (T - 1)) * w, y = v => bot - (v / (hi || 1)) * (bot - 2);
  let d = `M0,${y(vals[0]).toFixed(1)}`;
  vals.forEach((v, i) => { d += `L${x(i).toFixed(1)},${y(v).toFixed(1)}`; });
  let years = "";
  A.weeks.forEach((wk, i) => {
    if (i && wk.slice(0, 4) !== A.weeks[i - 1].slice(0, 4)) {
      years += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="0" y2="${bot}"
                 stroke="var(--hairline)" stroke-width="1"/>`;
    }
  });
  svg.innerHTML = years + `<path d="${d}L${w},${bot}L0,${bot}Z" fill="var(--fill)"/>` +
    `<path d="${d}" fill="none" stroke="${colour}" stroke-width="1.8"/>` +
    `<line x1="0" x2="${w}" y1="${bot}" y2="${bot}" stroke="var(--ink)" stroke-width="1"/>`;
}

/* The stack, as a share of each week. Every band is one way of writing and they fill the
   height; the arrival sits at the bottom, so its growth reads as a rising floor rather than a
   shape squeezed between others. Normalising per week is safe here in a way it would not have
   been earlier: every day contributes one full page of descriptions, so the denominator is
   near constant and a band cannot appear to shrink merely because the week around it grew. */
function stack(svg) {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 280, T = A.weeks.length;
  const tot = A.weeks.map((_, i) => A.components.reduce((s, c) => s + c.count[i], 0) || 1);
  const x = i => (i / (T - 1)) * w;
  let acc = new Array(T).fill(0), out = "";
  for (const c of A.components) {
    const top = c.count.map((v, i) => acc[i] + v / tot[i]);
    let d = `M0,${(h - acc[0] * h).toFixed(1)}`;
    for (let i = 0; i < T; i++) d += `L${x(i).toFixed(1)},${(h - top[i] * h).toFixed(1)}`;
    for (let i = T - 1; i >= 0; i--) d += `L${x(i).toFixed(1)},${(h - acc[i] * h).toFixed(1)}`;
    out += `<path d="${d}Z" fill="${c.lead ? "var(--accent)" : "var(--band)"}"
             stroke="var(--ground)" stroke-width="0.6"/>`;
    acc = top;
  }
  let years = "";
  for (const f of [0.25, 0.5, 0.75]) {
    const y = h - f * h;
    years += `<line x1="0" x2="${w}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
               stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 5" opacity="0.3"/>`
           + `<text x="6" y="${(y - 5).toFixed(1)}" fill="var(--ink)" opacity="0.55"
               font-size="10" font-family="inherit" letter-spacing="0.5">${f * 100}%</text>`;
  }
  A.weeks.forEach((wk, i) => {
    if (i && wk.slice(0, 4) !== A.weeks[i - 1].slice(0, 4)) {
      years += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="0" y2="${h}"
                 stroke="var(--ground)" stroke-width="1" opacity="0.6"/>`;
    }
  });
  svg.innerHTML = out + years + `<line class="cross" x1="0" x2="0" y1="0" y2="${h}"
    stroke="var(--ink)" stroke-width="1" opacity="0"/>`;
  const lead = A.components.find(c => c.lead);
  svg.onpointermove = ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(T - 1,
      Math.round(((ev.clientX - r.left) / r.width) * (T - 1))));
    const cr = svg.querySelector(".cross");
    cr.setAttribute("x1", ((i / (T - 1)) * r.width).toFixed(1));
    cr.setAttribute("x2", ((i / (T - 1)) * r.width).toFixed(1));
    cr.setAttribute("opacity", "0.6");
    show(`${A.weeks[i]}  ·  ${pc(lead.count[i] / tot[i])} of the week`, ev, r);
  };
  svg.onpointerleave = () => {
    tip.classList.remove("on");
    svg.querySelector(".cross").setAttribute("opacity", "0");
  };
}

function show(text, ev, r) {
  tip.textContent = text;
  tip.classList.add("on");
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(innerWidth - tw - 8, Math.max(8, ev.clientX - tw / 2)) + "px";
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
}

/* Hovering a word draws its own weekly history in the panel above the wall. The vertical
   scale is that word's own peak, printed beside it -- a shared scale would flatten every word
   except the handful of common ones, and these differ by three orders of magnitude. */
/* `?w=word` opens with that word already selected, which makes a particular word's history a
   link someone can send, and makes the hover state testable. */
function probe(i, j) {
  const c = A.components.filter(x => x.lead)[i];
  const p = app.querySelector(`.probe[data-lead="${i}"]`);
  const svg = p.querySelector("svg");
  if (j === null) {
    p.querySelector(".word").innerHTML =
      `<b>all ${fmt(c.word_list.length)} words together</b>`;
    p.querySelector(".meta").textContent =
      `${fmt(c.count[c.count.length - 1])} of `
      + `${fmt(A.docs_per_week[A.docs_per_week.length - 1])} descriptions in the last week`;
    area(svg, c.count, Math.max(...A.docs_per_week), "var(--accent)", 0);
    return;
  }
  const s = c.series[j], total = s.reduce((a, b) => a + b, 0);
  p.querySelector(".word").innerHTML = `<b>${esc(c.word_list[j])}</b>`;
  p.querySelector(".meta").textContent =
    `${c.word_lift[j]}× more probable here than elsewhere · `
    + `${fmt(total)} appearances · peak ${fmt(Math.max(...s))} in a week`;
  area(svg, s, Math.max(...s), "var(--accent)", 0);
}

function axis() {
  let out = `<span>${A.weeks[0]}</span>`;
  A.weeks.forEach((wk, i) => {
    if (i && wk.slice(0, 4) !== A.weeks[i - 1].slice(0, 4)) {
      const p = (i / (A.weeks.length - 1)) * 100;
      if (p > 8 && p < 88) out += `<span style="left:${p.toFixed(1)}%">${wk.slice(0, 4)}</span>`;
    }
  });
  return out + `<span class="last">${A.weeks[A.weeks.length - 1]}</span>`;
}

function build() {
  const months = Math.round(A.weeks.length * 7 / 30.44);
  const span = months >= 24
    ? `for ${(months / 12).toFixed(1).replace(/\.0$/, "")} years`
    : `for ${months} months`;
  const first = A.components.find(c => c.lead);
  const W = A.lead_window;
  const sum = a => a.reduce((s, v) => s + v, 0);
  // the component and its headline share are both read off the last `W` weeks, not the last
  // one: a week is 700 descriptions and the subject of the page should not turn on it
  const lastMonth = sum(first.count.slice(-W));
  const monthDocs = sum(A.docs_per_week.slice(-W));
  const firstMonth = sum(first.count.slice(0, W));
  const firstDocs = sum(A.docs_per_week.slice(0, W));
  // a week that was never collected stays in place as an empty week rather than being closed
  // up, so a share can be asked of a stretch with nothing in it
  const share = (n, d) => d ? pc(n / d) : "—";

  const walls = [first].map((c, i) => {
    const hiL = c.word_lift[0], loL = c.word_lift[c.word_lift.length - 1];
    // log scale, because measuring lift against everything-else spreads it over two orders of
    // magnitude -- 3,535x down to 4.2x -- and on a linear ramp every word past the first dozen
    // would sit at the minimum size
    const lg = Math.log, span = Math.max(lg(hiL) - lg(loL), 1e-9);
    const wall = c.word_list.map((w, j) => {
      const t = (lg(c.word_lift[j]) - lg(loL)) / span;
      return `<span data-lead="${i}" data-j="${j}" style="font-size:${(10.5 + 8 * t).toFixed(1)}px;`
        + `opacity:${(0.4 + 0.6 * t).toFixed(2)}">${esc(w)}</span>`;
    }).join("");
    return `<h2 style="margin-top:0">Its vocabulary</h2>
      <p class="note">The thousand words most characteristic of it, largest first &mdash;
        ${hiL}&times; more probable inside this way of writing than in everything that is not
        it for the first, ${loL}&times; for the thousandth. Size and shade follow that multiple.
        <b>Hover any word</b> to see its own week-by-week history above.</p>
      <div class="probe" data-lead="${i}">
        <div class="who"><span class="word"></span>
          <span class="label meta"></span></div>
        <svg></svg>
        <div class="axis label">${axis()}</div>
      </div>
      <div class="wall">${wall}</div>`;
  }).join("");

  app.innerHTML = `<header>
    <h1>The <em>load-bearing</em><br>vocabulary of Claude</h1>
    <p class="standfirst">Every pull request description opened on GitHub, one randomly
      placed five-minute window a day, ${span}. A model splits them into ${A.k} ways of
      writing. The largest of them today barely existed at the start, and is
      ${share(lastMonth, monthDocs)} of the last month.</p>
    <div class="stats">
      <div class="stat"><b>${fmt(A.documents)}</b><span class="label">descriptions</span></div>
      <div class="stat"><b>${A.weeks.length}</b><span class="label">weeks</span></div>
      <div class="stat"><b>${fmt(A.vocab)}</b><span class="label">words</span></div>
      <div class="stat"><b>${share(lastMonth, monthDocs)}</b>
        <span class="label">of the last month</span></div>
    </div></header>

    <section>
      <h2>It was not there, and then it was</h2>
      <p class="note">Each band is one of the ${A.k} ways of writing, and they stack to the
        whole of every week. The one in colour, at the bottom, is the largest of them across
        the last ${W} weeks; the other ${A.k - 1} are in grey behind it, because what matters
        is that one against the rest.</p>
      <div class="chart"><svg id="stack"></svg><div class="axis label">${axis()}</div></div>
      <p class="note" style="margin:16px 0 0">The arrival is
        ${share(lastMonth, monthDocs)} of the last month, against
        ${share(firstMonth, firstDocs)} of the first.</p>
    </section>

    <section>${walls}</section>

    <footer>
      <h2>How</h2>
      <p><b>Not GH Archive.</b> The obvious source for this is the public archive of GitHub's
        event stream, and it stopped working. Since mid&#8209;2025 its feed carries almost only
        <code>PushEvent</code>: a complete hour of 2024&#8209;08&#8209;12 holds 13,555
        <code>IssueCommentEvent</code> against 86 for the same hour of 2026&#8209;08&#8209;10,
        and polling <code>/events</code> in August 2026 returned 97 <code>PushEvent</code> out
        of the 100 most recent. Measured from the files themselves, the archive carried three
        to ten thousand issue comments an hour through 2025&#8209;10, then 1,590 in
        2026&#8209;03, 866 in 2026&#8209;06 and 77 in 2026&#8209;07. Pull requests and issues
        fell with them; pushes survive at full volume but carry no text, GitHub having
        <a href="https://github.blog/changelog/2025-08-08-upcoming-changes-to-github-events-api-payloads/">removed
        the commit array</a> from the payload in October 2025.</p>
      <p>The cause is upstream of the archive, in GitHub's own Events API. Its tracker carries
        <a href="https://github.com/igrigorik/gharchive.org/issues/310">&ldquo;Drastic Drop Off
        in Events After 2025&#8209;05&#8209;23&rdquo;</a>, open since July 2025 with no
        maintainer reply, and a
        <a href="https://github.com/orgs/community/discussions/178788">GitHub community
        discussion</a> traces the same loss to &ldquo;a GitHub Event API outage propagated
        downstream&rdquo; &mdash; the identical gaps appear in OSSInsight, which reads the API
        directly rather than through the archive. So no mirror repairs it:
        <a href="https://www.gharchive.org/">BigQuery <code>githubarchive</code></a>,
        <a href="https://ghe.clickhouse.tech/">ClickHouse GH Explorer</a> and the Kaggle and
        Hugging Face copies all read the same feed. GHTorrent has been dead since 2021, and
        <a href="https://docs.softwareheritage.org/devel/swh-export/graph/dataset.html">Software
        Heritage</a> archives real git history but exports once a year. GitHub has published no
        fix and no alternative.</p>
      <p>What does work is GitHub's search API, because <code>created:</code> accepts
        timestamps rather than only dates &mdash; so a window can be minutes wide, narrow
        enough to enumerate rather than sample, and each response carries the full body. This
        corpus is one randomly placed five&#8209;minute window of newly opened pull requests
        from every single day, so no week is looked at harder than another. A word is a run of
        letters, digits, hyphens and underscores; links become one token naming their domain;
        the em dash counts as a word.</p>
      <p><b>There is no time in the model.</b> Each of the ${A.k} components is a fixed
        probability distribution over the vocabulary, and one single mixture over those
        ${A.k} covers the whole window &mdash; not one mixture per week. So the fit has no
        parameter that could describe a trend and no freedom to place one. Every curve on this
        page is attribution instead: each description is assigned by its words alone, and the
        weeks are added up afterwards. The rise is in what people wrote, because there is
        nowhere else it could be.</p>
      <p>An earlier version did fit a mixture per week, with a smoothness penalty on how fast
        it could move. Running it with one mixture for the whole window was meant as a check,
        and the rise survived unchanged &mdash; which made the per-week version's extra
        parameters, ${A.weeks.length} &times; ${A.k} of them plus a penalty weight to tune,
        machinery that bought nothing except the suspicion that the model had drawn the trend
        itself. The check became the model.</p>
      <p>The component this page is about is simply the largest one of the last ${W} weeks.
        Nothing is selected on how much it grew. <code>analyze.py</code> then checks separately that
        the component so chosen did in fact arrive &mdash; under 2% of the first eight weeks,
        at or above 20% of the last eight &mdash; because that is what this page claims about
        it, and if it stops being true the page should not be published from that fit.</p>
      <p><b>How many components, and why that is not a neutral choice.</b> There are
        ${A.k}, and the number was chosen so that <code>load-bearing</code> &mdash; the word
        this page is named after &mdash; would rank among the five most characteristic words of
        the arriving component. It does, in 13 of 16 starting seeds, first in nine of them. At
        16 components it ranks 45th; at 24, third; at 32, first. That is selection on the
        outcome and cannot also be evidence for it: held-out likelihood prefers far more
        components than ${A.k}, and a coarser model lumps together registers a finer one
        separates, which is exactly why one word can come to dominate it. The rise is real and
        the vocabulary is real, but the <em>order</em> of this list was tuned until a chosen
        word came first, and no ranking here should be read as having been discovered.</p>
      <p>Lift is measured against the mixture of every <em>other</em> component, weighted by
        its share of appearances &mdash; not against the whole corpus. Dividing by the whole
        corpus understates a large component's own words, because by the end of the window one
        component is most of everything written, so its vocabulary was being compared mostly
        against itself.</p>
      <p>One caveat on the title. Words naming Claude are elevated inside this component while
        Cursor, ChatGPT, Codex and Copilot sit at or below the baseline &mdash; but
        <code>gpt-5</code> is elevated further still. The register is far more strongly associated with
        Claude than with most assistants, and it is not Claude's alone.</p>
      <div class="maths">
        <h2 style="font-size:1.15rem">The model, written out</h2>
        <dl>
          <dt><span class="tex">z_d ~ Categorical(pi),    x_d | z_d = k ~ Multinomial(n_d, W_k)</span></dt>
          <dd>A description <i>d</i> picks one of the ${A.k} components, then draws its
            <i>n<sub>d</sub></i> word tokens from that component's distribution over the
            vocabulary. Note what is absent: no <i>t</i>. The mixture <i>pi</i> carries no
            week index, so the same one governs every description in the window.</dd>

          <dt><span class="tex">sum_v W_{vk} = 1   for every k,      sum_k pi_k = 1</span></dt>
          <dd>Both factors are normalised, each for its own reason. Rows of <i>W</i> because
            they are word distributions; <i>pi</i> because the corpus is shared out among the
            components and nothing is left over.</dd>

          <dt><span class="tex">max  sum_d log sum_k pi_k prod_v W_{vk}^{x_{dv}}</span></dt>
          <dd>Plain maximum likelihood, with no penalty term of any kind. There is nothing to
            regularise: the previous version needed a smoothness penalty because it had
            ${A.weeks.length} &times; ${A.k} prevalences free to wander, and this one has
            ${A.k}.</dd>

          <dt><span class="tex">r_{dk} = pi_k prod_v W_{vk}^{x_{dv}} / sum_j pi_j prod_v W_{vj}^{x_{dv}}</span></dt>
          <dd>The responsibility: how much of description <i>d</i> belongs to component
            <i>k</i>. Fitting alternates between these and the two factors.</dd>

          <dt><span class="tex">C_{tk} = sum_{d : t(d) = t} r_{dk}</span></dt>
          <dd>And this is every curve on the page &mdash; the only place a week index appears
            anywhere. It is a sum over the fitted responsibilities, not a fitted quantity, so
            it was never optimised toward any shape.</dd>

          <dt><span class="tex">lift_k(v) = W_{vk} / [ sum_{j != k} m_j W_{vj} / sum_{j != k} m_j ]</span></dt>
          <dd>How much more probable a word is inside component <i>k</i> than in the mixture of
            all the others, weighted by their shares <i>m<sub>j</sub></i> of all appearances.
            The exclusion is doing enormous work: by the end of the window this component is
            most of everything written, so dividing by the whole corpus would compare its
            vocabulary mostly against itself. <code>load-bearing</code> scores 3.70× that way
            and 3,535× this way &mdash; a thousandfold difference, from one choice of
            denominator.</dd>
        </dl>
      </div>

      <p class="label" style="margin-top:30px">generated ${A.generated} &nbsp;·&nbsp; ${fmt(A.appearances)} word
        appearances over ${fmt(A.vocab)} words &nbsp;·&nbsp; ${A.k} components</p>
    </footer>`;

  render();
  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 150); });

  app.addEventListener("pointerover", ev => {
    const el = ev.target.closest(".wall [data-j]");
    if (!el) return;
    app.querySelectorAll(".wall .on").forEach(n => n.classList.remove("on"));
    el.classList.add("on");
    probe(+el.dataset.lead, +el.dataset.j);
  });
  // leaving the wall restores the whole component, so the panel is never left showing a word
  // the pointer has moved off
  app.querySelectorAll(".wall").forEach((wall, i) =>
    wall.addEventListener("pointerleave", () => {
      wall.querySelectorAll(".on").forEach(n => n.classList.remove("on"));
      probe(i, null);
    }));
}

function render() {
  stack(document.getElementById("stack"));
  const want = new URLSearchParams(location.search).get("w");
  A.components.filter(c => c.lead).forEach((c, i) => {
    const j = want ? c.word_list.indexOf(want) : -1;
    probe(i, j >= 0 ? j : null);
    if (j >= 0) {
      const el = app.querySelector(`.wall [data-lead="${i}"][data-j="${j}"]`);
      if (el) el.classList.add("on");
    }
  });
}

/* KaTeX is the page's only remote dependency and it is optional: the equations are written
   as readable ASCII in the markup and upgraded in place if the library loads, so the page is
   complete over file:// and merely plainer. */
// one entry per `.tex` span in .maths, in document order -- keep the two in step
const TEX = [
  String.raw`z_d \sim \mathrm{Categorical}(\pi), \qquad x_d \mid z_d = k \sim \mathrm{Multinomial}(n_d, W_k)`,
  String.raw`\sum_v W_{vk} = 1 \;\; \forall k, \qquad \sum_k \pi_k = 1`,
  String.raw`\max_{W,\pi} \; \sum_d \log \sum_k \pi_k \prod_v W_{vk}^{x_{dv}}`,
  String.raw`r_{dk} = \frac{\pi_k \prod_v W_{vk}^{x_{dv}}}{\sum_j \pi_j \prod_v W_{vj}^{x_{dv}}}`,
  String.raw`C_{tk} = \sum_{d \,:\, t(d) = t} r_{dk}`,
  String.raw`\mathrm{lift}_k(v) = W_{vk} \Big/ \frac{\sum_{j \ne k} m_j W_{vj}}{\sum_{j \ne k} m_j}`,
];

function typeset() {
  if (!window.katex) return;
  app.querySelectorAll(".maths .tex").forEach((el, i) => {
    if (!TEX[i]) return;
    try {
      katex.render(TEX[i], el, { displayMode: true, throwOnError: false });
      el.classList.remove("tex");
    } catch (e) { /* leave the ASCII in place */ }
  });
}

const kat = document.createElement("script");
kat.src = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js";
kat.onload = typeset;
document.head.appendChild(kat);

const tag = document.createElement("script");
tag.src = DATA;
tag.onload = () => { A = window.ANALYSIS; A ? (build(), typeset()) : fail(); };
tag.onerror = fail;
document.head.appendChild(tag);

function fail() {
  app.innerHTML = `<p style="padding:80px 0;font-family:ui-monospace,monospace">`
    + `<b>${DATA}</b> not found.<br>Run <b>python analyze.py</b> first.</p>`;
}
</script>
