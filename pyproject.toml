[project]
name = "lbdetect"
version = "0.1.0"
description = "Detect LLM-associated expressions through longitudinal GitHub language change"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "orjson>=3.9",
    "typer>=0.12",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.scripts]
lbdetect = "lbdetect.cli:app"
shift = "shift.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbdetect", "src/shift"]

[dependency-groups]
dev = ["pytest>=8.0"]
