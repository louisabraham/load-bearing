# One request a day, appended to the repository, then the analysis rebuilt.
#
# The corpus is the artifact here: each run adds one immutable file under data/days and never
# touches an earlier one, so the history of the repository is the history of the sample. The
# analysis.js is derived and rewritten every run.
#
# Pages is configured to build from the default branch, so committing is the deploy.
name: daily

on:
  schedule:
    - cron: "20 6 * * *"     # a little after 06:00 UTC, so yesterday is comfortably closed
  workflow_dispatch:
    inputs:
      backfill:
        description: "also fetch this many earlier missing days"
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false   # never interrupt a run that is part-way through committing

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install --quiet numpy scipy

      - name: Fetch yesterday
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_day.py --backfill ${{ inputs.backfill || 0 }}

      # Under a minute: one k-means++ run to a fixed point, on two sparse products a pass.
      - name: Analyse
        run: |
          python analyze.py --selftest
          python analyze.py --out analysis.js

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days analysis.js
          # nothing to say if the day was already present and the fit is unchanged
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Sample $(date -u -d yesterday +%F) and rebuild"
          # a human may have pushed while this ran; rebase rather than clobber
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
