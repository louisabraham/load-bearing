<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When each way of writing was born</title>
<script src="births.js"></script>
<style>
/* Two colours carry meaning, not identity: what was already here, and what was born.
   Twelve stacked bands cannot each have their own hue -- a twelve-step single-hue ramp
   cannot hold adequate lightness gaps and keep both ends visible against the surface, and
   twelve categorical hues is past any palette's limit. So the bands are one muted tone
   separated by hairline gaps, and the accent is reserved for a component with a birth date
   inside the window. Both colours are contrast-checked against both surfaces. */
:root {
  --ground:#f4f1ea; --ink:#14110f; --muted:#6b6459; --accent:#e8452c;
  --hairline:#ddd7ca; --band:#c9c1b2; --fill:#e8452c2e;
  --sans: ui-sans-serif, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --ground:#14110f; --ink:#f4f1ea; --muted:#a39b8e; --accent:#f0563a;
          --hairline:#302b26; --band:#3d372f; --fill:#f0563a33; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
       font:400 18px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
.wrap { max-width:1020px; margin:0 auto; padding:0 24px 96px; }
header { padding:72px 0 0; }
h1 { margin:0; font-weight:900; letter-spacing:-0.035em; line-height:0.92;
     font-size:clamp(2.4rem,7.5vw,5rem); text-transform:uppercase; }
h1 em { font-style:normal; color:var(--accent); }
.standfirst { margin:28px 0 0; max-width:64ch; font-size:clamp(1.05rem,2.1vw,1.28rem); }
.label { font:500 11px/1.3 var(--mono); text-transform:uppercase;
         letter-spacing:0.12em; color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
         margin:44px 0 0; border-top:4px solid var(--ink); border-bottom:4px solid var(--ink); }
.stat { padding:18px 20px 16px; border-right:1px solid var(--hairline); }
.stat:last-child { border-right:0; }
.stat b { display:block; font-size:2rem; font-weight:900; letter-spacing:-0.02em; }

section { border-top:4px solid var(--ink); margin-top:56px; padding-top:22px; }
h2 { font:900 clamp(1.4rem,3vw,2rem)/1.1 var(--sans); letter-spacing:-0.025em; margin:0 0 6px; }
.note { color:var(--muted); max-width:64ch; margin:0 0 22px; font-size:0.95rem; }
.stack svg { display:block; width:100%; height:300px; }
.axis { position:relative; height:15px; margin-top:6px; }
.axis span { position:absolute; top:0; white-space:nowrap; }
.axis .last { right:0; }

.rows { margin-top:8px; }
.row { display:grid; grid-template-columns:118px 1fr; gap:16px; align-items:center;
       padding:11px 0; border-top:1px solid var(--hairline); }
.row.born { background:var(--fill); }
.when { font:500 12px/1.35 var(--mono); }
.when b { display:block; font:900 1.05rem/1.15 var(--sans); letter-spacing:-0.02em; }
.row.born .when b { color:var(--accent); }
.row svg { display:block; width:100%; height:38px; }
.words { grid-column:1/-1; margin-top:2px; }
.chip { display:inline-block; font:500 12px/1 var(--mono); padding:5px 7px;
        border:1px solid var(--hairline); margin:0 4px 4px 0; max-width:30ch;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
.row.born .chip { border-color:var(--accent); }
#tip { position:fixed; pointer-events:none; opacity:0; z-index:10; background:var(--ink);
       color:var(--ground); padding:7px 9px; font:500 11px/1.45 var(--mono);
       white-space:nowrap; }
#tip.on { opacity:1; }
footer { border-top:4px solid var(--ink); margin-top:56px; padding-top:24px; }
footer p { max-width:66ch; margin:0 0 14px; }
footer code { font:500 0.9em var(--mono); }
</style>

<div class="wrap" id="app"></div>
<div id="tip"></div>

<script>
const B = window.BIRTHS;
const app = document.getElementById("app");
const tip = document.getElementById("tip");
const fmt = n => n.toLocaleString("en-US");
const pc = v => (v * 100 >= 10 ? (v * 100).toFixed(0) : (v * 100).toFixed(1)) + "%";
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const short = w => w.length > 26 ? w.slice(0, 25) + "…" : w;

/* "Born inside the window" needs a threshold, because the model puts three births after
   week zero and two of them are at weeks 1 and 7 -- components that were there all along
   whose opening weeks merely fell under the birth threshold. Absent for a tenth of the
   window is the line drawn here, and it leaves exactly the one genuine latecomer. */
const LATE = Math.round(0.1 * B.weeks.length);
const isLate = c => c.birth_index >= LATE;

/* The stack. Bands in birth order, oldest at the bottom, each separated from the next by a
   hairline of the surface so twelve of them stay countable without twelve colours. A band
   whose component was born inside the window is drawn in the accent. */
function stack(svg) {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 300;
  const T = B.weeks.length;
  const x = i => (i / (T - 1)) * w;
  let acc = new Array(T).fill(0), out = "";
  B.components.forEach(c => {
    const top = c.prevalence.map((v, i) => acc[i] + v);
    let d = `M0,${(h - acc[0] * h).toFixed(1)}`;
    for (let i = 0; i < T; i++) d += `L${x(i).toFixed(1)},${(h - top[i] * h).toFixed(1)}`;
    for (let i = T - 1; i >= 0; i--) d += `L${x(i).toFixed(1)},${(h - acc[i] * h).toFixed(1)}`;
    out += `<path d="${d}Z" fill="${isLate(c) ? "var(--accent)" : "var(--band)"}"
             stroke="var(--ground)" stroke-width="0.6"/>`;
    acc = top;
  });
  let years = "";
  B.weeks.forEach((wk, i) => {
    if (i && wk.slice(0, 4) !== B.weeks[i - 1].slice(0, 4)) {
      years += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="0" y2="${h}"
                 stroke="var(--ground)" stroke-width="1" opacity="0.6"/>`;
    }
  });
  svg.innerHTML = out + years +
    `<line class="cross" x1="0" x2="0" y1="0" y2="${h}" stroke="var(--ink)"
      stroke-width="1" opacity="0"/>`;
  svg.__hover = ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(T - 1,
      Math.round(((ev.clientX - r.left) / r.width) * (T - 1))));
    const cr = svg.querySelector(".cross");
    cr.setAttribute("x1", ((i / (T - 1)) * r.width).toFixed(1));
    cr.setAttribute("x2", ((i / (T - 1)) * r.width).toFixed(1));
    cr.setAttribute("opacity", "0.6");
    const live = B.components.filter(c => c.prevalence[i] > 0.02)
      .sort((a, b) => b.prevalence[i] - a.prevalence[i]).slice(0, 3)
      .map(c => `${pc(c.prevalence[i])} born ${c.birth}`).join("   ");
    tip.textContent = `${B.weeks[i]}   ${live}`;
    tip.classList.add("on");
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(innerWidth - tw - 8, Math.max(8, ev.clientX - tw / 2)) + "px";
    tip.style.top = (r.top - tip.offsetHeight - 8) + "px";
  };
}

/* One component's own curve, on a 0-to-1 axis shared with every other, its birth marked. */
function curve(svg, c) {
  const w = svg.clientWidth || 300, h = svg.clientHeight || 38;
  const T = B.weeks.length, hi = Math.max(...B.components.map(k => Math.max(...k.prevalence)));
  const x = i => (i / (T - 1)) * w, y = v => h - (v / hi) * (h - 2);
  let d = `M0,${h}`;
  c.prevalence.forEach((v, i) => { d += `L${x(i).toFixed(1)},${y(v).toFixed(1)}`; });
  const bx = x(c.birth_index).toFixed(1);
  const col = isLate(c) ? "var(--accent)" : "var(--muted)";
  svg.innerHTML =
    (isLate(c)
      ? `<line x1="${bx}" x2="${bx}" y1="0" y2="${h}" stroke="var(--accent)"
          stroke-width="1" stroke-dasharray="2 2"/>` : "") +
    `<path d="${d}L${w},${h}Z" fill="${col}" opacity="0.22"/>` +
    `<path d="${d.replace(/^M0,\d+(\.\d+)?/, "M0," + y(c.prevalence[0]).toFixed(1))}"
      fill="none" stroke="${col}" stroke-width="1.5"/>`;
}

function build() {
  const late = B.components.filter(isLate);
  let html = `<header>
    <h1>When each way<br>of writing was <em>born</em></h1>
    <p class="standfirst">Same corpus, a different model. Every component here has an
      unknown birth week and is <em>impossible</em> before it, so the empty stretch is a
      parameter the model estimates rather than a shape a penalty was asked to produce.
      ${B.k - late.length} of ${B.k} turn out to have been there the whole time. One was
      not.</p>
    <div class="stats">
      <div class="stat"><b>${fmt(B.documents)}</b><span class="label">documents</span></div>
      <div class="stat"><b>${B.weeks.length}</b><span class="label">weeks</span></div>
      <div class="stat"><b>${B.k}</b><span class="label">components</span></div>
      <div class="stat"><b>${late.length}</b><span class="label">born after week one</span></div>
    </div></header>

    <section>
      <h2>Everything written, week by week</h2>
      <p class="note">Each band is one component's share of that week's documents; the bands
        sum to the whole. Ordered by birth, oldest at the bottom. Accent marks a component
        with a birth date at least a tenth of the way into the window &mdash; it is not
        there, and then it is. The model dates two further births at weeks 1 and 7, which
        are components present throughout whose opening weeks merely fell under the
        threshold.</p>
      <div class="stack"><svg id="stack"></svg>
        <div class="axis label">${axis()}</div></div>
    </section>

    <section>
      <h2>The births</h2>
      <p class="note">One row per component, in the order they were born. Each curve is its
        prevalence on an axis shared with all the others; the dashed line is its estimated
        birth week. Words are ranked by how much more probable they are under that component
        than in the corpus at large.</p>
      <div class="rows">` + B.components.map((c, i) => `
        <div class="row${c.birth_index > 0 ? " born" : ""}">
          <span class="when"><b>${c.birth_index > 0 ? c.birth : "always"}</b>
            mean ${pc(c.share)}<br>peak ${pc(c.peak)}</span>
          <svg data-curve="${i}" role="img"
               aria-label="component born ${c.birth}, mean prevalence ${pc(c.share)}"></svg>
          <div class="words">` +
            c.word_list.slice(0, 22).map(w =>
              `<span class="chip" title="${esc(w)}">${esc(short(w))}</span>`).join("") +
          `</div></div>`).join("") + `</div></section>

    <footer>
      <h2>The model</h2>
      <p>Each component <code>k</code> is a fixed distribution <code>W&#8342;</code> over the
        vocabulary plus a birth week <code>&tau;&#8342;</code>. A document from week
        <code>t</code> picks a component from that week's prevalences
        <code>&pi;&#8348;</code> and then draws its words from that component's
        distribution. The prevalences sum to one in every week and are held at exactly zero
        before birth, so a document written before a component was born cannot be attributed
        to it. After birth the only thing asked of the curve is smoothness, &lambda; =
        ${B["lambda"]} on squared week-to-week change &mdash; nothing requires a component to
        rise, or to keep rising.</p>
      <p>Fitted by alternating four steps: attribute each document to components, refit the
        word distributions from those attributions, refit the prevalences under the birth
        constraint, and re-read the birth weeks off the curves.</p>
      <p>The fit is run ${B.n_init ?? 10} times from different starting points and the
        highest-likelihood run is kept, because one run is not enough. The component is
        stable across restarts &mdash; the same words, a peak between 66% and 73% &mdash;
        but its birth week is not: single runs put it anywhere across a 23&#8209;month range,
        because the birth threshold sits in the near-zero tail where a handful of documents
        decides whether a week clears it. Dropping 75 documents of 47,373 moved it thirteen
        weeks. Likelihood selection fixes most of that, and consistently prefers a later
        birth, because a better fit attributes the early tail elsewhere rather than to a
        component that had barely started. What survives is reported as an interval.</p>
      <p>That last step is not a search over candidate births by likelihood, which cannot
        work: a later birth is a strictly tighter constraint, so it can only lower the
        likelihood and the search returns week zero every time. Making it prefer lateness
        would need a per-live-week cost invented for the purpose. Instead each birth is read
        off an unconstrained fit of the same curve &mdash; the first week a component reaches
        a twentieth of its eventual peak and stays there &mdash; and the constrained fit is
        then redone. Re-deriving from the free fit each pass is what lets a birth move
        earlier as well as later; thresholding a curve that is already masked could only
        ratchet forward, so one early mistake would be permanent.</p>
      <p class="label">generated ${B.generated} &nbsp;·&nbsp; log-likelihood
        ${fmt(B.loglik)} &nbsp;·&nbsp; ${fmt(B.appearances)} word appearances over
        ${fmt(B.vocab)} words</p>
    </footer>`;
  app.innerHTML = html;
  render();
  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 150); });
  const s = document.getElementById("stack");
  s.addEventListener("pointermove", ev => s.__hover && s.__hover(ev));
  s.addEventListener("pointerleave", () => {
    tip.classList.remove("on");
    const c = s.querySelector(".cross"); if (c) c.setAttribute("opacity", "0");
  });
}

function axis() {
  let out = `<span>${B.weeks[0]}</span>`;
  B.weeks.forEach((wk, i) => {
    if (i && wk.slice(0, 4) !== B.weeks[i - 1].slice(0, 4)) {
      const p = (i / (B.weeks.length - 1)) * 100;
      if (p > 8 && p < 88) out += `<span style="left:${p.toFixed(1)}%">${wk.slice(0, 4)}</span>`;
    }
  });
  return out + `<span class="last">${B.weeks[B.weeks.length - 1]}</span>`;
}

function render() {
  stack(document.getElementById("stack"));
  B.components.forEach((c, i) =>
    curve(app.querySelector(`svg[data-curve="${i}"]`), c));
}

if (!B) {
  app.innerHTML = '<p style="padding:80px 0;font-family:var(--mono)">births.js not found.'
    + '<br>Run <b>python births.py</b> first.</p>';
} else {
  build();
}
</script>
