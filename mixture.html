<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The load-bearing vocabulary of Claude</title>
<style>
/* Two colours carry meaning rather than identity. Sixteen stacked bands cannot each have a
   hue -- a sixteen-step single-hue ramp holds neither adequate lightness gaps nor both ends
   visible against the surface -- so the bands are one muted tone and the accent is reserved
   for the one component that arrives. Both are contrast-checked against both surfaces. */
:root {
  --ground:#f4f1ea; --ink:#14110f; --muted:#6b6459; --accent:#e8452c;
  --hairline:#ddd7ca; --band:#c9c1b2; --fill:#e8452c2e;
  --sans: ui-sans-serif, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --ground:#14110f; --ink:#f4f1ea; --muted:#a39b8e; --accent:#f0563a;
          --hairline:#302b26; --band:#3d372f; --fill:#f0563a33; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
       font:400 18px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
.wrap { max-width:1020px; margin:0 auto; padding:0 24px 96px; }
header { padding:72px 0 0; }
h1 { margin:0; font-weight:900; letter-spacing:-0.035em; line-height:0.9;
     font-size:clamp(2.2rem,6.6vw,4.4rem); text-transform:uppercase; }
h1 em { font-style:normal; color:var(--accent); }
.standfirst { margin:28px 0 0; max-width:62ch; font-size:clamp(1.05rem,2.1vw,1.28rem); }
.label { font:500 11px/1.3 var(--mono); text-transform:uppercase;
         letter-spacing:0.12em; color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
         margin:40px 0 0; border-top:4px solid var(--ink); border-bottom:4px solid var(--ink); }
.stat { padding:18px 20px 16px; border-right:1px solid var(--hairline); }
.stat:last-child { border-right:0; }
.stat b { display:block; font-size:2rem; font-weight:900; letter-spacing:-0.02em; }
section { border-top:4px solid var(--ink); margin-top:56px; padding-top:22px; }
h2 { font:900 clamp(1.4rem,3vw,2rem)/1.1 var(--sans); letter-spacing:-0.025em; margin:0 0 8px; }
.note { color:var(--muted); max-width:66ch; margin:0 0 20px; font-size:0.95rem; }
.stack svg { display:block; width:100%; height:280px; }
.axis { position:relative; height:15px; margin-top:6px; }
.axis span { position:absolute; top:0; white-space:nowrap; }
.axis .last { right:0; }
/* the wall: a thousand words, sized and shaded by lift, so the strongest read first and the
   tail is visible as a tail rather than hidden behind a cut */
.wall { margin-top:18px; }
.wall span { display:inline-block; font-family:var(--mono); margin:0 7px 5px 0;
             white-space:nowrap; }
footer { border-top:4px solid var(--ink); margin-top:56px; padding-top:24px; }
footer p { max-width:66ch; margin:0 0 14px; }
footer code { font:500 0.9em var(--mono); }
#tip { position:fixed; pointer-events:none; opacity:0; z-index:10; background:var(--ink);
       color:var(--ground); padding:7px 9px; font:500 11px/1.45 var(--mono);
       white-space:nowrap; }
#tip.on { opacity:1; }
</style>

<div class="wrap" id="app"></div>
<div id="tip"></div>

<script>
const K_PARAM = new URLSearchParams(location.search).get("k");
const DATA = K_PARAM ? `mixture-k${encodeURIComponent(K_PARAM)}.js` : "mixture.js";
let B = null;
const app = document.getElementById("app");
const tip = document.getElementById("tip");
const fmt = n => Math.round(n).toLocaleString("en-US");
/* two significant figures however small, because the whole point of the first number is that
   it is nearly zero and "0.0%" hides that */
const pc = v => {
  const x = v * 100;
  return (x >= 10 ? x.toFixed(0) : x >= 1 ? x.toFixed(1) : x >= 0.01 ? x.toFixed(2)
          : x.toPrecision(2)) + "%";
};
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* The stack, in documents. Every band is one way of writing and they sum to the week; the one
   that arrives is drawn in the accent and sits at the bottom, so its growth reads as a rising
   floor rather than a shape squeezed between others. */
function stack(svg) {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 280, T = B.weeks.length;
  const hi = Math.max(...B.weeks.map((_, i) =>
    B.components.reduce((s, c) => s + c.count[i], 0)));
  const x = i => (i / (T - 1)) * w;
  let acc = new Array(T).fill(0), out = "";
  for (const c of B.components) {
    const top = c.count.map((v, i) => acc[i] + v);
    let d = `M0,${(h - acc[0] / hi * h).toFixed(1)}`;
    for (let i = 0; i < T; i++) d += `L${x(i).toFixed(1)},${(h - top[i] / hi * h).toFixed(1)}`;
    for (let i = T - 1; i >= 0; i--) d += `L${x(i).toFixed(1)},${(h - acc[i] / hi * h).toFixed(1)}`;
    out += `<path d="${d}Z" fill="${c.lead ? "var(--accent)" : "var(--band)"}"
             stroke="var(--ground)" stroke-width="0.6"/>`;
    acc = top;
  }
  let years = "";
  B.weeks.forEach((wk, i) => {
    if (i && wk.slice(0, 4) !== B.weeks[i - 1].slice(0, 4)) {
      years += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="0" y2="${h}"
                 stroke="var(--ground)" stroke-width="1" opacity="0.6"/>`;
    }
  });
  svg.innerHTML = out + years + `<line class="cross" x1="0" x2="0" y1="0" y2="${h}"
    stroke="var(--ink)" stroke-width="1" opacity="0"/>`;
  const lead = B.components.find(c => c.lead);
  svg.onpointermove = ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(T - 1,
      Math.round(((ev.clientX - r.left) / r.width) * (T - 1))));
    const cr = svg.querySelector(".cross");
    cr.setAttribute("x1", ((i / (T - 1)) * r.width).toFixed(1));
    cr.setAttribute("x2", ((i / (T - 1)) * r.width).toFixed(1));
    cr.setAttribute("opacity", "0.6");
    tip.textContent = `${B.weeks[i]}  ·  ${fmt(lead.count[i])} of `
      + `${fmt(B.docs_per_week[i])} descriptions`;
    tip.classList.add("on");
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(innerWidth - tw - 8, Math.max(8, ev.clientX - tw / 2)) + "px";
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
  };
  svg.onpointerleave = () => {
    tip.classList.remove("on");
    svg.querySelector(".cross").setAttribute("opacity", "0");
  };
}

function curve(svg, c) {
  const w = svg.clientWidth || 800, h = svg.clientHeight || 280, T = B.weeks.length;
  const hi = Math.max(...B.docs_per_week);
  const x = i => (i / (T - 1)) * w, y = v => h - (v / hi) * (h - 4);
  let d = `M0,${y(c.count[0]).toFixed(1)}`;
  c.count.forEach((v, i) => { d += `L${x(i).toFixed(1)},${y(v).toFixed(1)}`; });
  let rules = "";
  for (const f of [0.25, 0.5, 0.75, 1]) {
    const yy = (h - f * (h - 4)).toFixed(1);
    rules += `<line x1="0" x2="${w}" y1="${yy}" y2="${yy}" stroke="var(--hairline)"
               stroke-width="1"/>`;
  }
  svg.innerHTML = rules + `<path d="${d}L${w},${h}L0,${h}Z" fill="var(--fill)"/>` +
    `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>` +
    `<line x1="0" x2="${w}" y1="${h}" y2="${h}" stroke="var(--ink)" stroke-width="1"/>`;
}

function axis() {
  let out = `<span>${B.weeks[0]}</span>`;
  B.weeks.forEach((wk, i) => {
    if (i && wk.slice(0, 4) !== B.weeks[i - 1].slice(0, 4)) {
      const p = (i / (B.weeks.length - 1)) * 100;
      if (p > 8 && p < 88) out += `<span style="left:${p.toFixed(1)}%">${wk.slice(0, 4)}</span>`;
    }
  });
  return out + `<span class="last">${B.weeks[B.weeks.length - 1]}</span>`;
}

function build() {
  const c = B.components.find(x => x.lead);
  const hiLift = c.word_lift[0], loLift = c.word_lift[c.word_lift.length - 1];

  const wall = c.word_list.map((w, j) => {
    const t = (c.word_lift[j] - loLift) / Math.max(hiLift - loLift, 1e-9);   // 0..1
    const size = (10.5 + 7 * t).toFixed(1);
    const op = (0.4 + 0.6 * t).toFixed(2);
    return `<span style="font-size:${size}px;opacity:${op}"
             title="${esc(w)} — ${c.word_lift[j]}x">${esc(w)}</span>`;
  }).join("");

  app.innerHTML = `<header>
    <h1>The <em>load-bearing</em><br>vocabulary of Claude</h1>
    <p class="standfirst">Every pull request description opened on GitHub, sampled evenly week
      by week for two and a half years. A model splits them into ${B.k} ways of writing. One of
      them barely existed at the start and is most of the corpus by the end.</p>
    <div class="stats">
      <div class="stat"><b>${fmt(B.documents)}</b><span class="label">descriptions</span></div>
      <div class="stat"><b>${B.weeks.length}</b><span class="label">weeks</span></div>
      <div class="stat"><b>${pc(c.start_share)}</b><span class="label">of the first month</span></div>
      <div class="stat"><b>${pc(c.end_share)}</b><span class="label">of the last</span></div>
    </div></header>

    <section>
      <h2>It was not there, and then it was</h2>
      <p class="note">Each band is one of the ${B.k} ways of writing, stacking to every
        description that week. The one in colour is the arrival; the other ${B.k - 1} are
        drawn together in grey, because what matters is the one against the rest.</p>
      <div class="stack"><svg id="stack"></svg><div class="axis label">${axis()}</div></div>
      <p class="note" style="margin:16px 0 0">${fmt(c.count[c.count.length - 1])} of the
        ${fmt(B.docs_per_week[B.docs_per_week.length - 1])} descriptions in the final week,
        against ${c.count[0] < 1 ? "under one" : fmt(c.count[0])} in the first.</p>
    </section>

    <section>
      <h2>Its vocabulary</h2>
      <p class="note">The thousand words most characteristic of it, largest first. A word ranks
        high when it is far more probable inside this way of writing than in the corpus at
        large &mdash; ${hiLift}&times; for the first, ${loLift}&times; for the thousandth. Size
        and shade follow that multiple. Hover for the number.</p>
      <div class="wall">${wall}</div>
    </section>

    <footer>
      <h2>How</h2>
      <p>The source is GitHub's search API, five randomly placed five&#8209;minute windows of
        newly opened pull requests each week, so no week is looked at harder than another.
        A word is a run of letters, digits, hyphens and underscores; links become one token
        naming their domain; the em dash counts as a word.</p>
      <p>Each of the ${B.k} components is a fixed probability distribution over the vocabulary.
        Every week has a mixture over those ${B.k}, summing to one, and each description is
        taken to be drawn from one of them. Fitted by expectation&#8209;maximisation from
        ${B.n_init} starting points, keeping the best.</p>
      <p><code>mixture.py</code> asserts that exactly one component ends at least a hundred
        times its starting size while being worth at least a twentieth of the final weeks. That
        is not a close call in this fit &mdash; the one that qualifies ends 5,759 times its
        start and the next largest ratio is 4.1 &mdash; and if it ever stops holding, the page
        should not be published from that fit.</p>
      <p>One caveat on the title. Words naming Claude are elevated inside this component,
        <code>claude</code> at ${(4.35).toFixed(2)}&times; and its link at
        ${(4.48).toFixed(2)}&times;, while Cursor, ChatGPT, Codex and Copilot sit at or below
        the corpus baseline. But <code>gpt-5</code> is elevated further, at 5.20&times;. The
        register is far more strongly associated with Claude than with most assistants, and it
        is not Claude's alone.</p>
      <p class="label">generated ${B.generated} &nbsp;·&nbsp; ${fmt(B.appearances)} word
        appearances over ${fmt(B.vocab)} words &nbsp;·&nbsp; ${B.k} components</p>
    </footer>`;

  render();
  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 150); });
}

function render() {
  stack(document.getElementById("stack"));
}

const tag = document.createElement("script");
tag.src = DATA;
tag.onload = () => { B = window.MIXTURE; B ? build() : fail(); };
tag.onerror = fail;
document.head.appendChild(tag);

function fail() {
  app.innerHTML = `<p style="padding:80px 0;font-family:ui-monospace,monospace">`
    + `<b>${DATA}</b> not found.<br>Run <b>python mixture.py</b> first.</p>`;
}
</script>
